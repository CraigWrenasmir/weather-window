        && typeof loc.lat === 'number'
        && typeof loc.population === 'number'
        && loc.population >= 150_000 && loc.population < 2_000_000
        && loc.lat >= -38.5 && loc.lat <= -27 && loc.lon >= 138 && loc.lon <= 154,
      scene: 'aussie-suburb',
    },
    {
      // Tana Toraja highlands (South Sulawesi, Indonesia) → boat-roof tongkonan
      match: (loc) => loc.country_code === 'ID'
        && typeof loc.lat === 'number'
        && loc.lat >= -3.5 && loc.lat <= -2
        && loc.lon >= 119 && loc.lon <= 121,
      scene: 'toraja-tongkonan',
    },
    {
      // Cape Town wine region (Stellenbosch, Franschhoek, Paarl, Constantia)
      match: (loc) => loc.country_code === 'ZA'
        && typeof loc.lat === 'number'
        && loc.lat >= -34.4 && loc.lat <= -33.3
        && loc.lon >= 18.3 && loc.lon <= 19.5,
      scene: 'cape-dutch',
    },
    {
      // Small tropical Pacific / Indian Ocean island nations → palm-stilts
      match: (loc) => typeof loc.lat === 'number'
        && Math.abs(loc.lat) < 25
        && ['MV','PF','FJ','TO','WS','VU','SB','KI','TV','NR','PW','MH','FM','SC','MU','RE','CK','NU','AS','GU','MP'].includes(loc.country_code || ''),
      scene: 'tropical-island',
    },
  ];

  function pickScene(loc) {
    if (!loc) { currentSceneId = 'cottages'; return; }
    // 1. Megacity threshold first (so Melbourne/Sydney CBD stay urban even if their
    //    inner-suburb bboxes would otherwise pull them to terrace).
    if (typeof loc.population === 'number' && loc.population >= 5_000_000) {
      currentSceneId = 'urban';
      return;
    }
    // 2. Location-specific overrides
    for (const o of LOCATION_OVERRIDES) {
      try {
        if (o.match(loc)) { currentSceneId = o.scene; return; }
      } catch (e) {}
    }
    // 3. Mid-density inner-city threshold (800K–5M) — but only when the country has no
    //    distinct mapped style (so Amsterdam stays canal, Munich stays halftimber, etc.).
    if (typeof loc.population === 'number' && loc.population >= 800_000) {
      const cc = (loc.country_code || '').toUpperCase();
      const mapped = COUNTRY_TO_SCENE[cc];
      // Anglosphere → terrace (overrides cottage default)
      if (['AU','NZ','GB','IE','SG','HK','MY'].includes(cc)) {
        currentSceneId = 'inner-terrace';
        return;
      }
      // Anywhere else with no distinct country style → mid-rise apartments
      if (!mapped) {
        currentSceneId = 'inner-apartment';
        return;
      }
      // Mapped country with distinct style → keep country default; lat/lon overrides above
      // can still pull specific districts into inner-apartment (e.g. Paris, Berlin).
    }
    // 4. Country mapping
    let id = COUNTRY_TO_SCENE[(loc.country_code || '').toUpperCase()];
    // 5. Latitude override: high/low latitude → nordic
    if (!id && SCENES.nordic && typeof loc.lat === 'number' && (loc.lat > 60 || loc.lat < -55)) {
      id = 'nordic';
    }
    currentSceneId = id || 'cottages';
  }

  function drawHouses(ctx, vx, vy) {
    const scene = sceneOf();
    for (const h of scene.houses) {
      const draw = HOUSE_STYLES[h.style];
      if (draw) draw(ctx, vx + h.x, vy + h.y, h);
    }
  }

  function drawRoof(ctx, x, y, w, h, color) {
    // stepped pyramid (pixel triangle)
    const steps = h;
    const wSt = w / steps;
    for (let i = 0; i < steps; i++) {
      const sx = x + Math.round(i * wSt * 0.5);
      const sw = Math.max(1, Math.round(w - i * wSt));
      px(ctx, sx, y - i - 1, sw, 1, color);
    }
    // eaves
    px(ctx, x - 1, y - 1, w + 2, 1, shade(color, -0.2));
  }

  function drawRoofSnow(ctx, x, y, w, h, intensity) {
    const alpha = Math.min(1, intensity);
    ctx.fillStyle = `rgba(240,240,250,${0.85 * alpha})`;
    const steps = h;
    const wSt = w / steps;
    for (let i = 0; i < steps; i++) {
      const sx = x + Math.round(i * wSt * 0.5);
      const sw = Math.max(1, Math.round(w - i * wSt));
      // top of each step gets a pixel of snow
      ctx.fillRect(sx, y - i - 1, sw, 1);
      if (i > steps - 3) break;
    }
  }

  function shade(hexStr, amount) {
    const c = hex(hexStr);
    const factor = 1 + amount;
    const r = clamp(Math.round(c[0] * factor), 0, 255);
    const g = clamp(Math.round(c[1] * factor), 0, 255);
    const b = clamp(Math.round(c[2] * factor), 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // smoke particles
  const smokeSeed = new Map();
  function drawSmoke(ctx, x, y, seed) {
    const t = state.time * 0.5 + seed * 13;
    for (let i = 0; i < 5; i++) {
      const age = (t + i * 8) % 30;
      const sx = x + Math.sin((t + i) * 0.3) * (1 + age * 0.1);
      const sy = y - age * 0.6;
      const r = Math.max(1, 2 - age * 0.05);
      ctx.fillStyle = `rgba(180,180,190,${0.4 - age * 0.012})`;
      ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
  }

  // ---------- hills ----------
  function drawHills(ctx, vx, vy, vw, vh, dayMix) {
    const p = sceneOf().palette;
    const farColor = state.isDay
      ? lerpColor(hex(p.hillFar), hex(p.hillFarDark), 1 - dayMix)
      : p.nightFar;
    const midColor = state.isDay
      ? lerpColor(hex(p.hillMid), hex(p.hillMidDark), 1 - dayMix)
      : p.nightMid;
    const nearColor = state.isDay
      ? lerpColor(hex(p.hillNear), hex(p.hillNearDark), 1 - dayMix)
      : p.nightNear;

    // foggify
    const fog = state.fogIntensity;
    const fogged = (c) => {
      const cc = typeof c === 'string' && c.startsWith('rgb') ? c : c;
      const cArr = parseRgb(cc);
      const f = hex('#cfd6dc');
      return `rgb(${Math.round(lerp(cArr[0], f[0], fog))},${Math.round(lerp(cArr[1], f[1], fog))},${Math.round(lerp(cArr[2], f[2], fog))})`;
    };

    // draw 3 hill profiles using sin waves
    const hillProfile = (amp, freq, phase, baseY, color) => {
      ctx.fillStyle = color;
      for (let x = 0; x < vw; x++) {
        const yOff = Math.round(Math.sin(x * freq + phase) * amp + Math.sin(x * freq * 0.5 + phase * 1.7) * amp * 0.3);
        ctx.fillRect(vx + x, vy + baseY - yOff, 1, vh - (baseY - yOff));
      }
    };
    hillProfile(6, 0.06, 1.2, 84, fogged(farColor));
    hillProfile(5, 0.09, 3.1, 92, fogged(midColor));
    // near land — flatter ground for houses to sit on
    ctx.fillStyle = fogged(nearColor);
    ctx.fillRect(vx, vy + 104, vw, vh - 104);

    // snow ground accumulation
    if (state.snowIntensity > 0.15) {
      const alpha = Math.min(0.9, state.snowIntensity);
      ctx.fillStyle = `rgba(238,242,250,${alpha})`;
      ctx.fillRect(vx, vy + 104, vw, 2);
      ctx.fillStyle = `rgba(220,228,240,${alpha * 0.7})`;
      ctx.fillRect(vx, vy + 106, vw, vh - 106);
    }
  }
  function parseRgb(s) {
    if (s[0] === '#') return hex(s);
    const m = s.match(/rgb\((\d+),\s*(\d+),\s*(\d+)/);
    return [+m[1], +m[2], +m[3]];
  }

  // ---------- trees ----------
  function drawTrees(ctx, vx, vy) {
    const scene = sceneOf();
    for (const t of scene.trees) {
      const sway = Math.sin(state.time * 1.2 + t.x) * (state.windKph / 30) * t.sway;
      const draw = TREE_STYLES[t.style];
      if (draw) draw(ctx, vx + t.x, vy + t.y, t, sway);
    }
  }

  // ---------- clouds ----------
  // generate a stable set of cloud "puffs" that drift
  const CLOUDS = (() => {
    const arr = [];
    let seed = 1234;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let i = 0; i < 16; i++) {
      arr.push({
        x: rnd() * 240,
        y: 4 + rnd() * 50,
        w: 22 + rnd() * 30,
        h: 6 + rnd() * 6,
        speed: 0.04 + rnd() * 0.1,
      });
    }
    return arr;
  })();
  function drawClouds(ctx, vx, vy, vw) {
    const cover = state.cloudCover;
    // wind speed multiplier — minimum drift even in calm so movement is always visible
    const wind = 0.8 + state.windKph / 20;
    // always show at least 3 wispy clouds, scaling up to all 16 in overcast
    const visible = Math.max(3, Math.ceil(cover * CLOUDS.length));
    // opacity scales with cover so clear-day clouds are thin and wispy
    const cloudAlpha = clamp(0.35 + cover * 0.65, 0.35, 1);
    for (let i = 0; i < visible; i++) {
      const c = CLOUDS[i];
      const span = vw + c.w + 40;
      const drift = (state.time * c.speed * wind * 8) % span;
      const cx = vx + ((c.x + drift) % span) - c.w - 10;
      const cy = vy + c.y;
      // soft cloud built of stacked rects
      const baseColor = state.isDay
        ? lerpColor(hex('#f8f4ee'), hex('#9a98a4'), cover * 0.6)
        : lerpColor(hex('#7a7a92'), hex('#2a2a3a'), 0.4 + cover * 0.4);
      const shadowColor = state.isDay
        ? lerpColor(hex('#c6c1cf'), hex('#5a5868'), cover * 0.5)
        : lerpColor(hex('#4a4a5e'), hex('#181826'), 0.5);
      // storm tint
      const top = state.lightning ? shade(baseColor, -0.2) : baseColor;
      const bot = state.lightning ? shade(shadowColor, -0.3) : shadowColor;
      // shape (alpha makes clear-day clouds wispy)
      ctx.globalAlpha = cloudAlpha;
      ctx.fillStyle = bot;
      ctx.fillRect(cx, cy + 1, c.w, c.h - 1);
      ctx.fillStyle = top;
      ctx.fillRect(cx + 4, cy - 2, c.w - 8, c.h);
      ctx.fillRect(cx + 10, cy - 4, c.w - 20, c.h);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- sun / moon ----------
  // Returns lunar phase in [0,1): 0 = new, 0.25 = first quarter, 0.5 = full, 0.75 = last quarter.
  function computeMoonPhase(date) {
    const synodicSec = 29.530588853 * 86400;
    // Reference new moon: 2000-01-06 18:14 UTC
    const refMs = Date.UTC(2000, 0, 6, 18, 14, 0);
    const diffSec = (date.getTime() - refMs) / 1000;
    let p = (diffSec % synodicSec) / synodicSec;
    if (p < 0) p += 1;
    return p;
  }

  function drawCelestial(ctx, vx, vy, vw, vh) {
    // sun/moon arc across sky based on sunPhase
    const p = state.sunPhase;
    // arc from x = 0 (sunrise ~0.25) to vw (sunset ~0.75)
    const dayProgress = (p - 0.22) / 0.56; // 0 at sunrise, 1 at sunset
    const isMoon = !state.isDay;
    let cx, cy;
    if (!isMoon && dayProgress >= -0.05 && dayProgress <= 1.05) {
      const t = clamp(dayProgress);
      cx = vx + t * vw;
      cy = vy + 64 - Math.sin(t * Math.PI) * 50;
    } else {
      // night arc
      const nightP = p < 0.22 ? p + 1 : p;
      const t = clamp((nightP - 0.78) / 0.44);
      cx = vx + t * vw;
      cy = vy + 64 - Math.sin(t * Math.PI) * 50;
    }
    // hide if behind heavy clouds (still show faintly)
    const visAlpha = clamp(1 - state.cloudCover * 0.8);
    if (visAlpha < 0.05) return;

    if (isMoon) {
      // moon with current lunar phase
      const r = 5;
      const phase = computeMoonPhase(new Date());
      // bright disc (the fully-lit moon)
      ctx.fillStyle = `rgba(245,240,220,${visAlpha})`;
      drawDisc(ctx, cx, cy, r);
      // surface speckle (craters, faint)
      ctx.fillStyle = `rgba(200,195,175,${visAlpha * 0.5})`;
      drawDisc(ctx, cx - 1, cy - 1, 1);
      drawDisc(ctx, cx + 2, cy + 1, 1);
      // shadow disc — offsets along x with phase to carve a crescent/gibbous
      // waxing 0..0.5: shadow drifts from over-moon (-0) to past-left edge (-2r)
      // waning 0.5..1: shadow drifts from past-right edge (+2r) back to over-moon (0)
      // Reverse for southern hemisphere (moon appears flipped)
      const south = (state.location && state.location.lat < 0) ? -1 : 1;
      const dx = south * ((phase < 0.5) ? -4 * r * phase : 4 * r * (1 - phase));
      // skin the unlit side with a darker sky-coloured disc
      ctx.fillStyle = `rgba(20,24,42,${visAlpha * 0.92})`;
      drawDisc(ctx, cx + dx, cy, r);
      // faint outline so very-new moon still shows
      if (Math.abs(dx) < r * 1.5) {
        ctx.fillStyle = `rgba(140,140,160,${visAlpha * 0.18})`;
        drawDisc(ctx, cx, cy, r + 1);
      }
    } else {
      // sun glow
      ctx.fillStyle = `rgba(255,225,160,${0.25 * visAlpha})`;
      drawDisc(ctx, cx, cy, 9);
      ctx.fillStyle = `rgba(255,235,180,${0.4 * visAlpha})`;
      drawDisc(ctx, cx, cy, 7);
      ctx.fillStyle = `rgba(255,240,200,${visAlpha})`;
      drawDisc(ctx, cx, cy, 5);
    }
  }
  function drawDisc(ctx, cx, cy, r) {
    cx |= 0; cy |= 0;
    for (let y = -r; y <= r; y++) {
      const span = Math.floor(Math.sqrt(r*r - y*y));
      ctx.fillRect(cx - span, cy + y, span * 2 + 1, 1);
    }
  }

  // ---------- stars ----------
  const STARS = (() => {
    const arr = [];
    let s = 9999;
    const rnd = () => { s = (s * 1664525 + 1013904223) & 0x7fffffff; return s / 0x7fffffff; };
    for (let i = 0; i < 40; i++) {
      arr.push({ x: rnd(), y: rnd() * 0.5, twinkle: rnd() });
    }
    return arr;
  })();
  function drawStars(ctx, vx, vy, vw, vh) {
    // visible at night, faded by clouds
    const nightness = state.isDay
      ? 0
      : clamp((Math.abs(state.sunPhase - 0.5) - 0.28) / 0.18);
    const alpha = nightness * (1 - state.cloudCover * 0.95);
    if (alpha < 0.05) return;
    for (const s of STARS) {
      const tw = 0.5 + 0.5 * Math.sin(state.time * 2 + s.twinkle * 10);
      const a = alpha * tw;
      ctx.fillStyle = `rgba(245,242,225,${a})`;
      ctx.fillRect(vx + s.x * vw | 0, vy + s.y * vh * 0.7 | 0, 1, 1);
    }
  }

  // ---------- sky ----------
  function drawSky(ctx) {
    const { top, mid, bot } = getSkyColors();
    // 3-stop gradient drawn by horizontal strips so it pixelates nicely
    const h = VIEW.h;
    for (let y = 0; y < h; y++) {
      const t = y / h;
      let c;
      if (t < 0.5) {
        const tt = t / 0.5;
        c = [lerp(top[0], mid[0], tt), lerp(top[1], mid[1], tt), lerp(top[2], mid[2], tt)];
      } else {
        const tt = (t - 0.5) / 0.5;
        c = [lerp(mid[0], bot[0], tt), lerp(mid[1], bot[1], tt), lerp(mid[2], bot[2], tt)];
      }
      ctx.fillStyle = `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
      ctx.fillRect(VIEW.x, VIEW.y + y, VIEW.w, 1);
    }
  }

  // ---------- room interior ----------
  function drawRoom(ctx) {
    // wall
    px(ctx, 0, 0, W, H, '#3b2820');
    // wallpaper subtle texture — vertical stripes
    for (let x = 0; x < W; x += 4) {
      px(ctx, x, 0, 1, H, 'rgba(255,210,150,0.04)');
    }
    // wall warm light gradient near window — set later as overlay
    // skirting + floor
    px(ctx, 0, 152, W, H - 152, '#1a0f08');
    px(ctx, 0, 150, W, 2, '#0a0604');
    // floor planks
    for (let x = 0; x < W; x += 16) {
      px(ctx, x, 150, 1, 30, '#000');
    }
    // wall trim above floor
    px(ctx, 0, 148, W, 1, '#2a1a10');
    px(ctx, 0, 149, W, 1, '#5a3a25');
  }

  // ---------- window frame, curtains, cat ----------
  function drawWindowFrame(ctx) {
    const f = '#3a2415';
    const fLight = '#5a3a20';
    const fDark = '#1a0a05';
    // chunky outer frame, drawn as 4 strips so the glass area is NOT covered
    // top strip
    px(ctx, WIN.x - 4, WIN.y - 4, WIN.w + 8, 4, f);
    // bottom strip
    px(ctx, WIN.x - 4, WIN.y + WIN.h, WIN.w + 8, 4, f);
    // left strip
    px(ctx, WIN.x - 4, WIN.y, 4, WIN.h, f);
    // right strip
    px(ctx, WIN.x + WIN.w, WIN.y, 4, WIN.h, f);
    // outer highlights
    px(ctx, WIN.x - 4, WIN.y - 4, WIN.w + 8, 1, fLight);
    px(ctx, WIN.x - 4, WIN.y + WIN.h + 3, WIN.w + 8, 1, fDark);
    px(ctx, WIN.x - 4, WIN.y - 4, 1, WIN.h + 8, fLight);
    px(ctx, WIN.x + WIN.w + 3, WIN.y - 4, 1, WIN.h + 8, fDark);

    // inner frame (6px thick on each side, hollow)
    px(ctx, WIN.x, WIN.y, WIN.w, 6, f);
    px(ctx, WIN.x, WIN.y + WIN.h - 6, WIN.w, 6, f);
    px(ctx, WIN.x, WIN.y, 6, WIN.h, f);
    px(ctx, WIN.x + WIN.w - 6, WIN.y, 6, WIN.h, f);
    // highlight on inside lip
    px(ctx, WIN.x + 5, WIN.y + 5, WIN.w - 10, 1, fDark);
    px(ctx, WIN.x + 5, WIN.y + WIN.h - 6, WIN.w - 10, 1, fLight);
    px(ctx, WIN.x + 5, WIN.y + 5, 1, WIN.h - 10, fDark);
    px(ctx, WIN.x + WIN.w - 6, WIN.y + 5, 1, WIN.h - 10, fLight);

    // center mullions — cross
    const cx = WIN.x + WIN.w / 2 - 1;
    const cy = WIN.y + WIN.h / 2 - 1;
    px(ctx, cx, WIN.y + 6, 2, WIN.h - 12, f);
    px(ctx, WIN.x + 6, cy, WIN.w - 12, 2, f);
    px(ctx, cx, WIN.y + 6, 1, WIN.h - 12, fLight);
    px(ctx, WIN.x + 6, cy, WIN.w - 12, 1, fLight);

    // sill (deeper)
    px(ctx, SILL.x, SILL.y, SILL.w, SILL.h, '#5a3a22');
    px(ctx, SILL.x, SILL.y, SILL.w, 1, '#7a5230');
    px(ctx, SILL.x, SILL.y + SILL.h - 1, SILL.w, 1, '#2a1808');
    // sill drop shadow on wall
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(SILL.x, SILL.y + SILL.h, SILL.w, 2);

    // Snow accumulating on the windowsill when snowing — drift shape with a few peaks.
    if (state.snowIntensity > 0.05) {
      const alpha = Math.min(0.95, 0.6 + state.snowIntensity * 0.4);
      ctx.fillStyle = `rgba(248,250,255,${alpha})`;
      // base pile across the sill top
      ctx.fillRect(SILL.x, SILL.y - 1, SILL.w, 1);
      // wavy snow drift line above
      for (let dx = 0; dx < SILL.w; dx++) {
        const wave = Math.sin((SILL.x + dx) * 0.35) + Math.sin((SILL.x + dx) * 0.13);
        const peak = Math.max(0, Math.round((wave + 1.5) * state.snowIntensity));
        if (peak > 0) ctx.fillRect(SILL.x + dx, SILL.y - 1 - peak, 1, peak);
      }
      // a couple of tall accumulation peaks in the corners
      ctx.fillStyle = `rgba(248,250,255,${alpha * 0.85})`;
      ctx.fillRect(SILL.x + 2, SILL.y - 3, 4, 2);
      ctx.fillRect(SILL.x + SILL.w - 6, SILL.y - 3, 4, 2);
    }
  }

  function drawCurtains(ctx) {
    // simple cloth curtains hanging from above the window, tied back
    const top = WIN.y - 6;
    const bot = WIN.y + WIN.h + 2;
    // rod
    px(ctx, WIN.x - 14, top, WIN.w + 28, 2, '#3a2410');
    px(ctx, WIN.x - 16, top - 1, 4, 4, '#5a3a1c');
    px(ctx, WIN.x + WIN.w + 12, top - 1, 4, 4, '#5a3a1c');

    // left curtain
    drawCurtainHalf(ctx, WIN.x - 14, top + 2, 18, bot - top - 2, false);
    // right curtain
    drawCurtainHalf(ctx, WIN.x + WIN.w - 4, top + 2, 18, bot - top - 2, true);
  }
  function drawCurtainHalf(ctx, x, y, w, h, mirrored) {
    const base = '#6b2a2a';
    const dark = '#3e1414';
    const light = '#a04a3a';
    // body
    px(ctx, x, y, w, h, base);
    // folds
    for (let i = 0; i < 3; i++) {
      const fx = x + (mirrored ? w - 3 - i * 5 : i * 5 + 2);
      px(ctx, fx, y, 1, h, dark);
      px(ctx, fx + 1, y, 1, h, light);
    }
    // tiebacks halfway down — curtain narrows
    const tieY = y + h * 0.5;
    px(ctx, x, tieY, w, 2, '#2a0a0a');
    // tassle/rope
    px(ctx, mirrored ? x : x + w - 1, tieY + 2, 1, 3, '#d4a060');
  }

  // ---------- cat ----------
  // sitting cat from behind, head turned slightly looking out window
  // sprite uses a small letter grid; '.'=transparent, '#'=body, 'o'=eye, '-'=lighter, '*'=tip
  const CAT_SPRITE = [
    "..##....##....",
    ".####..####...",
    ".#####o###....",
    ".########.....",
    "############..",
    "############.*",
    "############*#",
    "############*#",
    "############*.",
    "############..",
    "############..",
    "############..",
    ".##########...",
    "..########....",
    "..########....",
    "..########....",
  ];
  const CAT_COLORS = {
    '#': '#1a1410',
    'o': '#86c46b',
    '-': '#2a201c',
    '*': '#0a0604',
  };
  function drawCat(ctx) {
    const cx = WIN.x + WIN.w / 2 - 12 - 8; // slightly left of center
    const cy = SILL.y - 16;
    // breathing
    const breath = Math.round(Math.sin(state.time * 1.6) * 0.5);
    for (let r = 0; r < CAT_SPRITE.length; r++) {
      const row = CAT_SPRITE[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const offY = (r < 4 ? 0 : breath); // body breathes, head stays
        ctx.fillStyle = CAT_COLORS[ch] || CAT_COLORS['#'];
        ctx.fillRect(cx + c, cy + r + offY, 1, 1);
      }
    }
    // cat shadow on sill
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(cx + 1, SILL.y - 1, CAT_SPRITE[0].length, 1);

    // tail curled to one side, drawn as a few pixels
    const tx = cx + 13;
    const ty = cy + 8 + breath;
    ctx.fillStyle = CAT_COLORS['#'];
    ctx.fillRect(tx, ty, 1, 1);
    ctx.fillRect(tx + 1, ty, 1, 1);
    ctx.fillRect(tx + 2, ty - 1, 1, 1);
    ctx.fillRect(tx + 2, ty - 2, 1, 1);
    ctx.fillRect(tx + 2, ty - 3, 1, 1);
    ctx.fillRect(tx + 1, ty - 4, 1, 1);
  }

  // ---------- interior furniture ----------
  function drawFurniture(ctx) {
    // small table on left under window
    const tx = 20, ty = 130;
    px(ctx, tx, ty, 24, 2, '#4a2a18');
    px(ctx, tx + 2, ty + 2, 2, 18, '#3a1e10');
    px(ctx, tx + 20, ty + 2, 2, 18, '#3a1e10');
    // teacup
    px(ctx, tx + 6, ty - 4, 6, 4, '#d4c0a8');
    px(ctx, tx + 6, ty - 4, 6, 1, '#fff6e0');
    px(ctx, tx + 12, ty - 3, 1, 2, '#d4c0a8');
    // steam (only if warm)
    if (state.temperatureC < 22) {
      const steamT = state.time * 2;
      ctx.fillStyle = 'rgba(220,220,230,0.4)';
      ctx.fillRect(tx + 7 + Math.round(Math.sin(steamT)), ty - 7, 1, 2);
      ctx.fillRect(tx + 9 + Math.round(Math.sin(steamT + 1)), ty - 9, 1, 2);
    }
    // plant on right
    const px2 = 268, py2 = 124;
    px(ctx, px2, py2 + 8, 10, 6, '#5a2818'); // pot
    px(ctx, px2, py2 + 8, 10, 1, '#8a4a30');
    // leaves
    ctx.fillStyle = '#3a5a2a';
    for (let i = 0; i < 8; i++) {
      const lx = px2 + 1 + ((i * 3) % 8);
      const ly = py2 + Math.max(0, 8 - i);
      ctx.fillRect(lx, ly, 2, 2);
    }
    // floor lamp / standing lamp far left
    px(ctx, 6, 110, 1, 40, '#1a1008');
    px(ctx, 4, 110, 5, 2, '#2a1810');
    // lamp shade — centred at x=6.5, y=108
    const lampOn = !state.isDay || state.cloudCover > 0.7;
    if (lampOn) {
      // outer halo (wide, faint) — centred on shade
      ctx.fillStyle = 'rgba(255,210,140,0.08)';
      ctx.fillRect(-5, 96, 24, 28);
      // mid halo
      ctx.fillStyle = 'rgba(255,210,140,0.14)';
      ctx.fillRect(-2, 100, 18, 20);
      // tight halo
      ctx.fillStyle = 'rgba(255,220,160,0.22)';
      ctx.fillRect(1, 103, 12, 14);
      // shade
      px(ctx, 3, 104, 7, 8, '#f0c878');
      px(ctx, 3, 104, 7, 1, '#fff0c0');
    } else {
      px(ctx, 3, 104, 7, 8, '#6a5848');
    }
  }

  // ---------- lighting overlays ----------
  function drawLighting(ctx) {
    const sunUp = (state.sunPhase > 0.23 && state.sunPhase < 0.77) && state.isDay;
    // darken only the ROOM at night (not the sky — it has its own night palette)
    if (!sunUp) {
      ctx.fillStyle = 'rgba(8,6,20,0.4)';
      // room above the window (top strip)
      if (WIN.y > 0) ctx.fillRect(0, 0, W, WIN.y - 4);
      // left wall
      ctx.fillRect(0, WIN.y - 4, WIN.x - 4, H);
      // right wall
      ctx.fillRect(WIN.x + WIN.w + 4, WIN.y - 4, W - (WIN.x + WIN.w + 4), H);
      // below window
      ctx.fillRect(0, WIN.y + WIN.h + 4, W, H - (WIN.y + WIN.h + 4));
    }
    // warm light spill from window onto wall/floor — only when bright outside
    if (sunUp && state.cloudCover < 0.7) {
      ctx.fillStyle = 'rgba(255,220,160,0.05)';
      ctx.fillRect(WIN.x - 30, SILL.y + SILL.h + 1, WIN.w + 60, 12);
    }
    // lightning flash
    if (state.flashUntil > state.time) {
      const a = state.flashStrength * (state.flashUntil - state.time) / 0.15;
      ctx.fillStyle = `rgba(220,225,255,${a})`;
      ctx.fillRect(0, 0, W, H);
    }
    // fog veil over the view
    if (state.fogIntensity > 0.05) {
      ctx.fillStyle = `rgba(210,215,225,${state.fogIntensity * 0.45})`;
      ctx.fillRect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    }
    // glass tint / reflection — faint diagonal sheen
    ctx.fillStyle = 'rgba(255,255,255,0.025)';
    ctx.fillRect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
  }

  // ---------- weather particles ----------
  const rainDrops = [];
  const snowFlakes = [];
  const hailStones = [];      // hail for codes 96/99
  const windowDrops = []; // drips on the glass

  function ensureParticles() {
    const targetRain = Math.floor(state.rainIntensity * 220);
    while (rainDrops.length < targetRain) rainDrops.push(newRain());
    while (rainDrops.length > targetRain) rainDrops.pop();
    const targetSnow = Math.floor(state.snowIntensity * 90);
    while (snowFlakes.length < targetSnow) snowFlakes.push(newSnow());
    while (snowFlakes.length > targetSnow) snowFlakes.pop();
    const targetHail = Math.floor((state.hailIntensity || 0) * 80);
    while (hailStones.length < targetHail) hailStones.push(newHail());
    while (hailStones.length > targetHail) hailStones.pop();
    const targetDrops = Math.floor(state.rainIntensity * 30);
    while (windowDrops.length < targetDrops) windowDrops.push(newWindowDrop());
    while (windowDrops.length > targetDrops) windowDrops.pop();
  }
  function newRain() {
    return {
      x: VIEW.x + Math.random() * VIEW.w,
      y: VIEW.y + Math.random() * VIEW.h,
      len: 4 + Math.random() * 4,
      vy: 4 + Math.random() * 3 + state.rainIntensity * 2,
      vx: state.windKph / 12 + Math.random() * 0.4,
    };
  }
  function newSnow() {
    return {
      x: VIEW.x + Math.random() * VIEW.w,
      y: VIEW.y + Math.random() * VIEW.h,
      vy: 0.3 + Math.random() * 0.5,
      vx: (Math.random() - 0.4) * 0.4 + state.windKph / 60,
      drift: Math.random() * Math.PI * 2,
      size: Math.random() < 0.3 ? 2 : 1,
    };
  }
  function newHail() {
    return {
      x: VIEW.x + Math.random() * VIEW.w,
      y: VIEW.y + Math.random() * VIEW.h,
      vy: 6 + Math.random() * 4 + state.hailIntensity * 3,
      vx: state.windKph / 18 + Math.random() * 0.3,
      size: Math.random() < 0.4 ? 2 : 1,
    };
  }
  function newWindowDrop() {
    return {
      x: VIEW.x + 4 + Math.random() * (VIEW.w - 8),
      y: VIEW.y + 4 + Math.random() * (VIEW.h - 20),
      vy: 0.1 + Math.random() * 0.3,
      life: 0,
      maxLife: 80 + Math.random() * 120,
      size: 1 + Math.floor(Math.random() * 2),
    };
  }

  function drawAndStepRain(ctx) {
    if (rainDrops.length === 0) return;
    ctx.strokeStyle = 'rgba(160,190,220,0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of rainDrops) {
      d.x += d.vx;
      d.y += d.vy;
      if (d.y > VIEW.y + VIEW.h || d.x < VIEW.x || d.x > VIEW.x + VIEW.w) {
        d.x = VIEW.x + Math.random() * VIEW.w;
        d.y = VIEW.y - 4;
      }
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.vx * 0.6, d.y - d.len);
    }
    ctx.stroke();
  }
  function drawAndStepSnow(ctx) {
    if (snowFlakes.length === 0) return;
    for (const f of snowFlakes) {
      f.drift += 0.04;
      f.x += f.vx + Math.sin(f.drift) * 0.2;
      f.y += f.vy;
      if (f.y > VIEW.y + VIEW.h) {
        f.x = VIEW.x + Math.random() * VIEW.w;
        f.y = VIEW.y - 2;
      }
      if (f.x < VIEW.x) f.x += VIEW.w;
      if (f.x > VIEW.x + VIEW.w) f.x -= VIEW.w;
      ctx.fillStyle = f.size > 1 ? 'rgba(255,255,255,0.95)' : 'rgba(235,240,250,0.85)';
      ctx.fillRect(f.x|0, f.y|0, f.size, f.size);
    }
  }
  // Edge condensation / foggy halo on the inside of the glass.
  function drawCondensation(ctx) {
    const wet = Math.max(state.rainIntensity * 0.8, state.fogIntensity * 1.0);
    const cold = Math.max(0, Math.min(1, (12 - state.temperatureC) / 12)) * 0.5;
    const intensity = Math.max(wet, cold);
    if (intensity < 0.05) return;
    const baseA = intensity * 0.32;
    // top inner edge
    ctx.fillStyle = `rgba(220,235,245,${baseA})`;
    ctx.fillRect(VIEW.x, VIEW.y, VIEW.w, 2);
    // left + right edges
    ctx.fillRect(VIEW.x, VIEW.y, 2, VIEW.h);
    ctx.fillRect(VIEW.x + VIEW.w - 2, VIEW.y, 2, VIEW.h);
    // bottom edge (heavier — condensation runs down)
    ctx.fillStyle = `rgba(230,242,250,${baseA * 1.4})`;
    ctx.fillRect(VIEW.x, VIEW.y + VIEW.h - 3, VIEW.w, 3);
    // hazy halo softening corners
    ctx.fillStyle = `rgba(220,235,245,${baseA * 0.5})`;
    ctx.fillRect(VIEW.x, VIEW.y + 2, 4, 4);
    ctx.fillRect(VIEW.x + VIEW.w - 4, VIEW.y + 2, 4, 4);
    ctx.fillRect(VIEW.x, VIEW.y + VIEW.h - 6, 4, 3);
    ctx.fillRect(VIEW.x + VIEW.w - 4, VIEW.y + VIEW.h - 6, 4, 3);
    // tiny condensation droplets clustered near bottom corners
    if (state.rainIntensity > 0.25 || state.fogIntensity > 0.3) {
      ctx.fillStyle = `rgba(240,250,255,${intensity * 0.7})`;
      for (let i = 0; i < 18; i++) {
        const hashA = (Math.sin(i * 12.91) * 9301) % 1;
        const hashB = (Math.sin(i * 27.13) * 4321) % 1;
        const ax = Math.abs(hashA) - Math.floor(Math.abs(hashA));
        const ay = Math.abs(hashB) - Math.floor(Math.abs(hashB));
        const dx = VIEW.x + 3 + Math.floor(ax * (VIEW.w - 6));
        // bias toward bottom (more condensation runs down)
        const dy = VIEW.y + VIEW.h - 4 - Math.floor(ay * 8);
        ctx.fillRect(dx, dy, 1, 1);
      }
    }
  }

  function drawAndStepHail(ctx) {
    if (hailStones.length === 0) return;
    for (const h of hailStones) {
      h.x += h.vx;
      h.y += h.vy;
      if (h.y > VIEW.y + VIEW.h || h.x < VIEW.x || h.x > VIEW.x + VIEW.w) {
        h.x = VIEW.x + Math.random() * VIEW.w;
        h.y = VIEW.y - 4;
      }
      // bright icy stone with darker shadow at bottom
      ctx.fillStyle = 'rgba(240,245,255,0.95)';
      ctx.fillRect(h.x|0, h.y|0, h.size, h.size);
      if (h.size > 1) {
        ctx.fillStyle = 'rgba(170,190,220,0.7)';
        ctx.fillRect((h.x + 1)|0, (h.y + 1)|0, 1, 1);
      }
    }
  }
  // Rainbow shown in light-rain + partly-cloudy + daytime conditions.
  function shouldShowRainbow() {
    return state.isDay
      && state.cloudCover >= 0.25 && state.cloudCover <= 0.75
      && state.rainIntensity >= 0.1 && state.rainIntensity <= 0.6
      && state.sunPhase > 0.27 && state.sunPhase < 0.73;
  }
  function drawRainbow(ctx, vx, vy, vw, vh) {
    // alpha fades with cloud cover (more cloud = fainter rainbow)
    const alpha = Math.max(0.15, 0.55 - state.cloudCover * 0.45);
    const colors = [
      [220, 90,  90],
      [220, 140, 60],
      [220, 200, 80],
      [110, 180, 90],
      [80,  160, 210],
      [120, 100, 200],
      [170, 90,  200],
    ];
    const cx = vx + vw / 2;
    // arc centre is INSIDE the view (near the bottom) so the whole arc fits
    // and the endpoints can't poke out below the window onto the wall.
    const cy = vy + vh - 4;
    const baseR = vh * 0.78;
    for (let i = 0; i < colors.length; i++) {
      const r = baseR + i;
      const [cr, cg, cb] = colors[i];
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
      // Walk the arc from angle π (west) to 2π (east) via 3π/2 (top).
      const steps = Math.max(60, Math.floor(r * Math.PI));
      for (let s = 0; s <= steps; s++) {
        const angle = Math.PI + (Math.PI * s / steps);
        const px2 = Math.round(cx + Math.cos(angle) * r);
        const py2 = Math.round(cy + Math.sin(angle) * r);
        if (px2 >= vx && px2 < vx + vw && py2 >= vy && py2 < vy + vh) {
          ctx.fillRect(px2, py2, 1, 1);
        }
      }
    }
  }

  function drawAndStepGlassDrops(ctx) {
    if (windowDrops.length === 0) return;
    for (const d of windowDrops) {
      d.life++;
      d.y += d.vy;
      d.vy += 0.015;
      if (d.life > d.maxLife || d.y > VIEW.y + VIEW.h - 4) {
        Object.assign(d, newWindowDrop());
      }
      // bead with brighter top edge
      ctx.fillStyle = 'rgba(200,225,250,0.7)';
      ctx.fillRect(d.x|0, d.y|0, d.size, d.size);
      ctx.fillStyle = 'rgba(240,250,255,0.5)';
      ctx.fillRect(d.x|0, d.y|0, 1, 1);
      // longer trail behind the drip
      ctx.fillStyle = 'rgba(180,210,240,0.4)';
      ctx.fillRect(d.x|0, (d.y - 3)|0, 1, 3);
      ctx.fillStyle = 'rgba(180,210,240,0.18)';
      ctx.fillRect(d.x|0, (d.y - 6)|0, 1, 3);
    }
  }

  // ---------- main draw ----------
  function draw() {
    // base
    drawRoom(sctx);

    // outside scene — clip everything to the glass area so nothing spills onto the wall
    sctx.save();
    sctx.beginPath();
    sctx.rect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    sctx.clip();
    drawSky(sctx);
    drawStars(sctx, VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    drawCelestial(sctx, VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    drawClouds(sctx, VIEW.x, VIEW.y, VIEW.w);
    if (shouldShowRainbow()) drawRainbow(sctx, VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    const dayMix = state.isDay ? clamp((1 - Math.abs(state.sunPhase - 0.5) * 2.2)) : 0.1;
    const backdrop = sceneOf().backdrop || drawHills;
    backdrop(sctx, VIEW.x, VIEW.y, VIEW.w, VIEW.h, dayMix);
    drawHouses(sctx, VIEW.x, VIEW.y);
    drawTrees(sctx, VIEW.x, VIEW.y);
    // condensation drawn over the view but before the frame (still inside the clip
    // so it doesn't bleed onto the wall around the window)
    drawCondensation(sctx);
    sctx.restore();

    // interior elements drawn over outside (in front of glass)
    drawWindowFrame(sctx);
    drawCurtains(sctx);
    drawFurniture(sctx);

    // overlays
    drawLighting(sctx);

    // fx layer (particles) — clear and redraw
    fctx.clearRect(0, 0, W, H);
    // particles only inside the view (rain/snow) so they don't draw on the room
    fctx.save();
    fctx.beginPath();
    fctx.rect(VIEW.x, VIEW.y, VIEW.w, VIEW.h);
    fctx.clip();
    drawAndStepRain(fctx);
    drawAndStepSnow(fctx);
    drawAndStepHail(fctx);
    drawAndStepGlassDrops(fctx);
    fctx.restore();
  }

  // ---------- animation loop ----------
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    state.time += dt;

    // periodic lightning
    if (state.lightning && Math.random() < dt * 0.4 && t > state.flashUntil + 1500) {
      state.flashUntil = state.time + 0.18;
      state.flashStrength = 0.5 + Math.random() * 0.4;
    }

    // periodic weather refresh (every 10 min)
    if (t > state.nextFetchAt) {
      state.nextFetchAt = t + 10 * 60 * 1000;
      if (state.location) fetchWeather(state.location).catch(() => {});
    }

    ensureParticles();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- weather API ----------
  async function fetchWeather(loc) {
    showLoading(true);
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,wind_speed_10m,weather_code,is_day&timezone=auto&daily=sunrise,sunset&forecast_days=1`;
      const res = await fetch(url);
      const data = await res.json();
      const cur = data.current;
      state.weatherCode = cur.weather_code;
      state.temperatureC = cur.temperature_2m;
      state.windKph = cur.wind_speed_10m;
      state.isDay = cur.is_day;
      // compute sunPhase from local time + sunrise/sunset
      const tz = data.timezone;
      const nowIso = cur.time; // "2026-05-19T15:00" in local tz
      const sunriseIso = data.daily.sunrise[0];
      const sunsetIso = data.daily.sunset[0];
      state.sunPhase = computeSunPhase(nowIso, sunriseIso, sunsetIso);
      state.location.tz = tz;
      applyWeatherCode(state.weatherCode);
      pickScene(state.location);
      updateStatusUI();
    } catch (e) {
      console.warn('weather fetch failed', e);
    } finally {
      showLoading(false);
    }
  }

  function computeSunPhase(nowIso, sunriseIso, sunsetIso) {
    // all in local timezone, naive strings — parse manually
    const toMins = (iso) => {
      const t = iso.split('T')[1] || '12:00';
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    };
    const n = toMins(nowIso);
    const sr = toMins(sunriseIso);
    const ss = toMins(sunsetIso);
    // map sunrise → 0.25, sunset → 0.75, midnight → 0
    let phase;
    if (n >= sr && n <= ss) {
      // day
      phase = 0.25 + ((n - sr) / (ss - sr)) * 0.5;
    } else if (n < sr) {
      // pre-dawn
      const nightLen = (24 * 60 - ss) + sr;
      const elapsed = (24 * 60 - ss) + n;
      phase = 0.75 + (elapsed / nightLen) * 0.5;
      if (phase >= 1) phase -= 1;
    } else {
      // after sunset
      const nightLen = (24 * 60 - ss) + sr;
      const elapsed = n - ss;
      phase = 0.75 + (elapsed / nightLen) * 0.5;
      if (phase >= 1) phase -= 1;
    }
    return phase;
  }

  async function geocode(query) {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=en&format=json`;
    const res = await fetch(url);
    const data = await res.json();
    return (data.results || []).map(r => ({
      name: r.name,
      country: r.country || '',
      country_code: r.country_code || '',
      admin: r.admin1 || '',
      lat: r.latitude,
      lon: r.longitude,
      population: r.population || 0,
    }));
  }

  // ---------- UI ----------
  const $ = (id) => document.getElementById(id);
  const ui = $('ui');
  const hint = $('hint');
  const sugg = $('suggestions');
  const locInput = $('loc-input');
  const locGo = $('loc-go');
  const locName = $('loc-name');
  const weatherDesc = $('weather-desc');
  const tempEl = $('temp');
  const windEl = $('wind');
  const localTimeEl = $('local-time');
  const loadingEl = $('loading');

  function showLoading(v) { loadingEl.classList.toggle('show', v); }

  function updateStatusUI() {
    locName.textContent = `${state.location.name}${state.location.admin ? ', ' + state.location.admin : ''}${state.location.country ? ' · ' + state.location.country : ''}`;
    weatherDesc.textContent = state.weatherDesc || '';
    tempEl.textContent = `${Math.round(state.temperatureC)}°C`;
    windEl.textContent = `${Math.round(state.windKph)} km/h`;
    try {
      const opts = { hour: '2-digit', minute: '2-digit', timeZone: state.location.tz };
      localTimeEl.textContent = new Date().toLocaleTimeString([], opts);
    } catch {
      localTimeEl.textContent = '—';
    }
  }
  // refresh local time every 30s
  setInterval(updateStatusUI, 30000);

  let searchTimer = 0;
  locInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = locInput.value.trim();
    if (q.length < 2) { sugg.classList.remove('open'); sugg.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      try {
        const results = await geocode(q);
        sugg.innerHTML = '';
        for (const r of results) {
          const div = document.createElement('div');
          div.className = 'suggestion';
          div.innerHTML = `${r.name}${r.admin ? ', ' + r.admin : ''}<span class="country">${r.country}</span>`;
          div.addEventListener('click', () => {
            state.location = { name: r.name, country: r.country, country_code: r.country_code, admin: r.admin, lat: r.lat, lon: r.lon, population: r.population };
            saveLocation();
            locInput.value = '';
            sugg.classList.remove('open');
            state.nextFetchAt = 0;
            fetchWeather(state.location);
          });
          sugg.appendChild(div);
        }
        sugg.classList.toggle('open', results.length > 0);
      } catch (e) {
        console.warn('geocode failed', e);
      }
    }, 220);
  });
  locInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = sugg.querySelector('.suggestion');
      if (first) first.click();
    }
    if (e.key === 'Escape') {
      sugg.classList.remove('open');
      locInput.blur();
    }
  });
  locGo.addEventListener('click', () => {
    const first = sugg.querySelector('.suggestion');
    if (first) first.click();
    else if (locInput.value.trim().length >= 2) locInput.dispatchEvent(new Event('input'));
  });

  // hide UI / fullscreen
  function setUiHidden(v) {
    ui.classList.toggle('hidden', v);
    document.querySelector('.controls').classList.toggle('hidden', v);
    hint.classList.toggle('hidden', v);
  }
  let uiHidden = false;
  $('hide-ui').addEventListener('click', () => {
    uiHidden = !uiHidden;
    setUiHidden(uiHidden);
  });
  $('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target === locInput) return;
    if (e.key === 'h' || e.key === 'H') { uiHidden = !uiHidden; setUiHidden(uiHidden); }
    if (e.key === 'f' || e.key === 'F') $('fullscreen-btn').click();
  });

  // hint fades after 6s
  setTimeout(() => hint.classList.add('hidden'), 6000);

  // persistence
  function saveLocation() {
    try { localStorage.setItem('cozy-window-location', JSON.stringify(state.location)); } catch {}
  }
  function loadLocation() {
    try {
      const s = localStorage.getItem('cozy-window-location');
      if (s) state.location = JSON.parse(s);
    } catch {}
  }

  // ---------- boot ----------
  async function boot() {
    loadLocation();
    // if no stored location, default to Newcastle, NSW
    if (!state.location || !state.location.lat) {
      const results = await geocode('Newcastle, NSW').catch(() => []);
      if (results.length) {
        state.location = results[0];
      } else {
        state.location = { name: 'Newcastle', country: 'Australia', country_code: 'AU', admin: 'NSW', lat: -32.9283, lon: 151.7817 };
      }
      saveLocation();
    }
    applyWeatherCode(0);
    pickScene(state.location);
    updateStatusUI();
    await fetchWeather(state.location);
    requestAnimationFrame(loop);
  }
  boot();
})();
</script>
</body>
</html>
