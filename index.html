      }
      // chimney
      if (h.chimney) {
        const cx = bx + h.chimney.x;
        const cy = by + h.chimney.y;
        px(ctx, cx, cy, h.chimney.w, h.chimney.h, '#5a3a25');
        px(ctx, cx, cy, h.chimney.w, 1, '#7a5a45');
      }
      // white picket fence in front (optional)
      if (h.picket) {
        const fy = by + h.h;
        for (let x = bx - 1; x < bx + h.w + 1; x += 3) {
          px(ctx, x, fy + 1, 1, 3, '#f0e8d4');
        }
        px(ctx, bx - 1, fy + 2, h.w + 2, 1, '#f0e8d4');
      }
    },

    // Sahelian round hut — circular mud-walled hut with conical thatched roof
    'round-hut'(ctx, bx, by, h) {
      const cx = bx + (h.w >> 1);
      const r = h.w / 2;
      // mud-wall body (slight rounded silhouette)
      for (let y = 0; y < h.h; y++) {
        const yT = y / Math.max(1, h.h - 1);
        const halfW = Math.max(1, Math.round(r * (1 - yT * 0.12)));
        const xL = cx - halfW;
        const w = halfW * 2 + 1;
        px(ctx, xL, by + y, w, 1, h.body);
        // shadow right
        px(ctx, xL + w - 1, by + y, 1, 1, shade(h.body, -0.22));
        // highlight left
        px(ctx, xL, by + y, 1, 1, shade(h.body, 0.1));
      }
      // base shadow
      px(ctx, cx - r, by + h.h - 1, h.w, 1, shade(h.body, -0.3));

      // conical thatched roof
      const roofH = h.roofH || 7;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(1, Math.round(h.w + 2 - t * (h.w + 1)));
        const sx = cx - Math.floor(sw / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        // thatch lines (highlight every other row)
        if (i > 0 && i % 2 === 0 && sw > 3) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.18));
        }
      }
      // dark eave at base of roof
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.35));

      // small dark doorway
      if (h.door) {
        const dW = h.door.w || 3;
        const dH = h.door.h || 4;
        const dx = cx - (dW >> 1);
        const dy = by + h.h - dH;
        px(ctx, dx, dy, dW, dH, '#1a0a04');
        // arched top
        px(ctx, dx, dy, dW, 1, '#0a0402');
      }
      // small dark windows (just slits)
      if (h.windows) {
        for (const w of h.windows) {
          const wx = bx + w.x, wy = by + w.y;
          const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
          px(ctx, wx, wy, w.w, w.h, lit ? '#f0a040' : '#1a0e04');
          if (lit) {
            ctx.fillStyle = 'rgba(240,160,64,0.18)';
            ctx.fillRect(wx - 1, wy - 1, w.w + 2, w.h + 2);
          }
        }
      }
    },

    // MENA earthen cube — sand/cream stucco with flat roof, ornamental options:
    //   h.windTower: adds a Gulf-style barjeel (wind tower) on the roof
    //   h.dome: adds a Persian-style rooftop dome (h.domeColor tints it)
    //   h.archDoor: tall arched doorway
    'mena-house'(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // soft shadow on right
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.2));
      // soft highlight on left
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // base shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.25));

      // ornamental trim band near top
      if (h.trimColor) {
        px(ctx, bx, by + 1, h.w, 1, h.trimColor);
        px(ctx, bx, by + h.h - 3, h.w, 1, h.trimColor);
      }

      // Flat parapet roof
      const parH = 2;
      px(ctx, bx - 1, by - parH, h.w + 2, parH, h.body);
      px(ctx, bx - 1, by - parH, h.w + 2, 1, shade(h.body, -0.2));
      // small notch detail at top corners
      px(ctx, bx - 1, by - parH - 1, 2, 1, h.body);
      px(ctx, bx + h.w - 1, by - parH - 1, 2, 1, h.body);

      // Wind tower (barjeel) on roof — square tower with vertical slats
      if (h.windTower) {
        const wtW = 5, wtH = 8;
        const wtX = bx + Math.floor((h.w - wtW) / 2);
        const wtY = by - parH - wtH - 1;
        px(ctx, wtX, wtY, wtW, wtH, h.body);
        px(ctx, wtX, wtY, 1, wtH, shade(h.body, 0.06));
        px(ctx, wtX + wtW - 1, wtY, 1, wtH, shade(h.body, -0.2));
        // openings (vertical dark slats)
        px(ctx, wtX + 1, wtY + 2, 1, wtH - 4, '#2a1810');
        px(ctx, wtX + 3, wtY + 2, 1, wtH - 4, '#2a1810');
        // top edge
        px(ctx, wtX - 1, wtY - 1, wtW + 2, 1, shade(h.body, -0.2));
        px(ctx, wtX - 1, wtY - 1, wtW + 2, 1, shade(h.body, 0.15));
      }

      // Persian-style dome
      if (h.dome) {
        const dW = h.domeW || 9;
        const dH = h.domeH || 5;
        const dX = bx + Math.floor((h.w - dW) / 2);
        const dY = by - parH - dH;
        const domeColor = h.domeColor || '#3a7aa8';
        // ellipsoid dome (rows narrow toward top)
        for (let y = 0; y < dH; y++) {
          const t = y / Math.max(1, dH - 1);
          const w = Math.max(1, Math.round(dW * Math.sin(Math.PI * (1 - t) * 0.5 + 0.1)));
          const x = dX + Math.floor((dW - w) / 2);
          px(ctx, x, dY + y, w, 1, domeColor);
          if (y > 0 && w > 2) px(ctx, x, dY + y, 1, 1, shade(domeColor, 0.18));
          if (y > 0 && w > 2) px(ctx, x + w - 1, dY + y, 1, 1, shade(domeColor, -0.22));
        }
        // base ring
        px(ctx, dX, dY + dH, dW, 1, shade(domeColor, -0.35));
        // spire
        px(ctx, dX + (dW >> 1), dY - 2, 1, 2, '#d4a040');
        px(ctx, dX + (dW >> 1), dY - 3, 1, 1, '#f0d050');
      }

      // windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const glassColor = lit ? '#f0c878' : '#3a2a18';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // arched top suggestion (1 corner pixel cut on each side)
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, shade(h.body, -0.4));
        px(ctx, wx, wy, w.w, w.h, glassColor);
        // arch hint (top row gets a darker inset on the corners)
        if (w.h >= 4) {
          px(ctx, wx, wy, 1, 1, shade(h.body, -0.4));
          px(ctx, wx + w.w - 1, wy, 1, 1, shade(h.body, -0.4));
        }
        // lattice grid (mashrabiya hint)
        for (let dx = 1; dx < w.w; dx += 2) px(ctx, wx + dx, wy, 1, w.h, shade(glassColor, -0.4));
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }

      // door (often arched, often deep coloured)
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        const dColor = d.color || '#5a3a22';
        // tall door with arched top suggestion
        px(ctx, dx, dy, d.w, d.h, dColor);
        // arch corner cuts
        if (d.h >= 6) {
          px(ctx, dx, dy, 1, 1, h.body);
          px(ctx, dx + d.w - 1, dy, 1, 1, h.body);
        }
        // brass knocker
        px(ctx, dx + d.w - 2, dy + (d.h >> 1), 1, 1, '#d4a040');
        // wooden grain line
        px(ctx, dx + (d.w >> 1), dy + 1, 1, d.h - 2, shade(dColor, -0.3));
      }
    },

    // Stilt-tropical: wooden house raised on tall stilts, steep thatched roof, simple veranda
    'stilt-tropical'(ctx, bx, by, h) {
      const stiltH = h.stiltH || 6;
      const stiltColor = '#3a2818';
      const stiltY = by + h.h;
      // stilts
      px(ctx, bx + 2, stiltY, 1, stiltH, stiltColor);
      px(ctx, bx + h.w - 3, stiltY, 1, stiltH, stiltColor);
      if (h.w >= 14) px(ctx, bx + (h.w >> 1), stiltY, 1, stiltH, stiltColor);
      // ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(bx + 1, stiltY + stiltH, h.w - 2, 1);

      // body — wooden walls
      px(ctx, bx, by, h.w, h.h, h.body);
      // vertical plank lines
      for (let x = bx + 2; x < bx + h.w - 1; x += 3) {
        px(ctx, x, by + 1, 1, h.h - 2, shade(h.body, -0.22));
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.28));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));

      // steep thatched/clay roof — narrow at top, wide overhang at bottom
      const roofH = h.roofH || 5;
      const overhang = h.overhang || 2;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = h.w + overhang * 2 - Math.round(t * (h.w + overhang * 2 - 2));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        if (sw > 0) {
          px(ctx, sx, by - i - 1, sw, 1, h.roof);
          if (i > 0 && i % 2 === 0 && sw > 4) {
            px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.14));
          }
        }
      }
      // dark eave underside
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.3));

      // ladder/stairs on one side (suggested)
      if (h.ladder) {
        const lx = bx + h.w - 4;
        for (let i = 0; i < stiltH; i++) {
          if (i % 2 === 0) px(ctx, lx, stiltY + i, 3, 1, '#5a3a22');
        }
      }
      // verandah strip
      if (h.veranda) {
        px(ctx, bx - 1, by + h.h - 1, h.w + 2, 1, shade(h.body, -0.35));
        px(ctx, bx - 1, by + h.h - 2, h.w + 2, 1, shade(h.body, -0.15));
      }

      drawWarmWindows(ctx, bx, by, h);
      drawSimpleDoor(ctx, bx, by, h);
    },

    // Chinese hutong: grey brick body, dark curved tile roof with prominent upturned eaves
    hutong(ctx, bx, by, h) {
      // brick body
      px(ctx, bx, by, h.w, h.h, h.body);
      // brick mortar lines (alternating brick pattern)
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        const offset = ((y - by) % 4 === 2) ? 2 : 0;
        for (let x = bx + offset; x < bx + h.w; x += 4) {
          px(ctx, x, y, 1, 1, shade(h.body, -0.2));
        }
        px(ctx, bx, y - 1, h.w, 1, shade(h.body, -0.18));
      }
      // edge shadow
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.25));
      // stone foundation
      px(ctx, bx - 1, by + h.h - 2, h.w + 2, 2, '#3a3a3a');

      // curved tile roof with overhang and pronounced upturned eaves
      const roofH = h.roofH || 5;
      const overhang = h.overhang || 4;
      for (let i = 0; i < roofH; i++) {
        const t = roofH > 1 ? i / (roofH - 1) : 0;
        const sw = h.w + overhang * 2 - Math.round(t * (overhang * 2 + h.w * 0.5));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        if (sw > 0) {
          px(ctx, sx, by - i - 1, sw, 1, h.roof);
          if (i > 0 && i % 2 === 1 && sw > 4) {
            px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.14));
          }
        }
      }
      // ridge cap with end pieces
      const ridgeW = Math.max(2, h.w - Math.round(h.w * 0.45));
      const ridgeX = bx + Math.round((h.w - ridgeW) / 2);
      px(ctx, ridgeX, by - roofH - 1, ridgeW, 1, shade(h.roof, -0.4));
      px(ctx, ridgeX - 1, by - roofH - 1, 1, 1, shade(h.roof, -0.55));
      px(ctx, ridgeX + ridgeW, by - roofH - 1, 1, 1, shade(h.roof, -0.55));
      // upturned eave corners — small flick up from outer corner
      px(ctx, bx - overhang - 1, by - 1, 1, 1, h.roof);
      px(ctx, bx - overhang - 2, by - 2, 1, 1, h.roof);
      px(ctx, bx + h.w + overhang, by - 1, 1, 1, h.roof);
      px(ctx, bx + h.w + overhang + 1, by - 2, 1, 1, h.roof);
      // dark eave underside
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.5));

      // bright red door (iconic for hutong courtyards)
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        const dColor = d.color || '#a8302a';
        px(ctx, dx, dy, d.w, d.h, dColor);
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, shade(dColor, -0.35));
        px(ctx, dx, dy, d.w, 1, shade(dColor, 0.2));
        // gold knockers
        px(ctx, dx + 1, dy + (d.h >> 1), 1, 1, '#d4a040');
        px(ctx, dx + d.w - 2, dy + (d.h >> 1), 1, 1, '#d4a040');
      }

      // small lattice windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const glassColor = lit ? '#f0c878' : '#3a4658';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, glassColor);
        // lattice grid (more divisions than typical window)
        for (let dx = 1; dx < w.w; dx += 2) px(ctx, wx + dx, wy, 1, w.h, '#3a2818');
        for (let dy = 1; dy < w.h; dy += 2) px(ctx, wx, wy + dy, w.w, 1, '#3a2818');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.16)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
    },

    // Korean hanok: white plaster with visible wooden posts, curved tile roof with strong corner upturn
    hanok(ctx, bx, by, h) {
      // white plaster body
      px(ctx, bx, by, h.w, h.h, h.body);
      // top and bottom wooden beams
      px(ctx, bx, by, h.w, 1, '#5a3a22');
      px(ctx, bx, by + h.h - 1, h.w, 1, '#3a2418');
      // vertical wooden posts
      for (let x = bx + 3; x < bx + h.w - 1; x += 5) {
        px(ctx, x, by + 1, 1, h.h - 2, '#6a4630');
      }
      // edge posts (slightly thicker)
      px(ctx, bx, by, 1, h.h, '#5a3a22');
      px(ctx, bx + h.w - 1, by, 1, h.h, '#3a2418');
      // stone foundation
      px(ctx, bx - 1, by + h.h - 2, h.w + 2, 2, '#3a3a3a');
      px(ctx, bx - 1, by + h.h - 2, h.w + 2, 1, '#5a5a5a');

      // dark tile roof — wider overhang, dramatic corner upturn
      const roofH = h.roofH || 5;
      const overhang = h.overhang || 5;
      for (let i = 0; i < roofH; i++) {
        const t = roofH > 1 ? i / (roofH - 1) : 0;
        const sw = h.w + overhang * 2 - Math.round(t * (overhang * 2 + h.w * 0.55));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        if (sw > 0) {
          px(ctx, sx, by - i - 1, sw, 1, h.roof);
        }
      }
      // ridge cap
      const ridgeW = Math.max(2, h.w - Math.round(h.w * 0.5));
      const ridgeX = bx + Math.round((h.w - ridgeW) / 2);
      px(ctx, ridgeX, by - roofH - 1, ridgeW, 1, shade(h.roof, -0.4));
      // tile groove lines
      for (let i = 1; i < roofH; i += 2) {
        const t = i / (roofH - 1);
        const sw = h.w + overhang * 2 - Math.round(t * (overhang * 2 + h.w * 0.55));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        if (sw > 4) px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.12));
      }
      // strong corner upturn (3-pixel flick)
      px(ctx, bx - overhang - 1, by - 1, 1, 1, h.roof);
      px(ctx, bx - overhang - 2, by - 2, 1, 1, h.roof);
      px(ctx, bx - overhang - 2, by - 3, 1, 1, h.roof);
      px(ctx, bx + h.w + overhang, by - 1, 1, 1, h.roof);
      px(ctx, bx + h.w + overhang + 1, by - 2, 1, 1, h.roof);
      px(ctx, bx + h.w + overhang + 1, by - 3, 1, 1, h.roof);
      // dark eave underside
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.5));

      // paper rice-paper windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const paperColor = lit ? '#f0d8a4' : '#c8c0a8';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, paperColor);
        // vertical paper-screen lines
        for (let dx = 1; dx < w.w; dx += 2) px(ctx, wx + dx, wy, 1, w.h, shade(paperColor, -0.3));
        if (lit) {
          ctx.fillStyle = 'rgba(240,210,140,0.18)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }

      // wooden sliding door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, '#3a2818');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#1a1008');
        px(ctx, dx, dy, d.w, 1, '#5a3a25');
      }
    },

    // Vietnamese tube-house: very narrow tall colorful home, ornate balcony, French-influenced shutters
    'tube-house'(ctx, bx, by, h) {
      // tall colorful body
      px(ctx, bx, by, h.w, h.h, h.body);
      // edge shadow (vibrant pastels need depth)
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.22));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // floor divider lines (suggests multiple stories)
      const floors = Math.max(2, Math.floor(h.h / 8));
      const floorH = h.h / floors;
      for (let f = 1; f < floors; f++) {
        const fy = by + Math.round(f * floorH);
        px(ctx, bx, fy, h.w, 1, shade(h.body, -0.3));
        // small balcony rail
        px(ctx, bx - 1, fy + 1, h.w + 2, 1, '#2a1810');
        for (let dx = bx; dx < bx + h.w; dx += 2) {
          px(ctx, dx, fy + 2, 1, 1, '#3a2818');
        }
      }

      // small peaked roof (modest gable)
      const roofH = h.roofH || 2;
      for (let i = 0; i < roofH; i++) {
        const sw = h.w + 2 - i * 2;
        const sx = bx - 1 + i;
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
      }
      // ornamental top
      px(ctx, bx + (h.w >> 1) - 1, by - roofH - 1, 2, 1, shade(h.roof, -0.3));

      // tall narrow shuttered windows on each floor
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const glassColor = lit ? '#f0c878' : '#3a4658';
      const shutterColor = h.shutterColor || '#3a5e8a';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // dark frame
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#2a1810');
        // glass
        px(ctx, wx, wy, w.w, w.h, glassColor);
        // shutters
        px(ctx, wx - 2, wy - 1, 1, w.h + 2, shutterColor);
        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutterColor);
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }
      // ground-floor wooden door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a3a22');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#2a1810');
      }
    },

    // Lighthouse — slim tapered white tower with black lantern dome and warm beam
    // h.w = base width (≈8), h.h = total height (≈26) including antenna at top
    lighthouse(ctx, bx, by, h) {
      const cx = bx + Math.floor(h.w / 2);
      const yAnt = by;
      const yDome = by + 4;
      const yLantern = by + 6;
      const yRail = by + 11;
      const yTower = by + 12;
      const yBase = by + h.h - 3;
      // antenna
      px(ctx, cx, yAnt, 1, 3, '#1a1a1a');
      px(ctx, cx - 1, yAnt + 1, 3, 1, '#1a1a1a');
      // tapered black dome
      px(ctx, cx - 2, yDome, 5, 1, '#2a2a2a');
      px(ctx, cx - 3, yDome + 1, 7, 1, '#1f1f1f');
      // lantern room (white frame)
      px(ctx, cx - 3, yLantern, 7, 4, h.body);
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const glass = lit ? '#ffd640' : '#586878';
      px(ctx, cx - 2, yLantern + 1, 5, 2, glass);
      px(ctx, cx, yLantern + 1, 1, 2, '#2a2a2a');
      // sweeping beam at night
      if (lit) {
        ctx.fillStyle = 'rgba(255,220,100,0.22)';
        const beamSweep = Math.sin(state.time * 0.7) * 18;
        ctx.fillRect(cx - 20 + beamSweep, yLantern + 1, 40, 2);
      }
      // railing band
      px(ctx, cx - 4, yRail, 9, 1, '#1a1a1a');
      // tower (white, tapered)
      const towerH = yBase - yTower;
      for (let i = 0; i < towerH; i++) {
        px(ctx, cx - 3, yTower + i, 6, 1, h.body);
        px(ctx, cx + 2, yTower + i, 1, 1, shade(h.body, -0.18));
        px(ctx, cx - 3, yTower + i, 1, 1, shade(h.body, 0.1));
      }
      // wider base
      px(ctx, cx - 4, yBase, 9, 3, h.body);
      px(ctx, cx + 4, yBase, 1, 3, shade(h.body, -0.2));
      px(ctx, cx - 4, yBase, 1, 3, shade(h.body, 0.05));
      px(ctx, cx - 4, yBase + 2, 9, 1, shade(h.body, -0.35));
      // small dark door
      px(ctx, cx - 1, yBase, 2, 3, '#3a2818');
    },

    // Keeper's quarters / outbuilding — small white house with simple low-pitch roof
    keeper(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.18));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.06));
      // base shadow line
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.22));
      // dark sloped roof
      const roofH = h.roofH || 2;
      for (let i = 0; i < roofH; i++) {
        const sw = h.w + 2 - i * 2;
        const sx = bx - 1 + i;
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
      }
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.35));
      // small chimney
      if (h.chimney) {
        const ccx = bx + h.chimney.x;
        px(ctx, ccx, by - h.chimney.h - 1, h.chimney.w, h.chimney.h, '#4a4a4a');
      }
      // windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a3a3a');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#4a5868');
        if (w.w >= 3) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a5a5a');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      // door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#3a2818');
      }
    },

    // Urban skyscraper: narrow tall building with grid of windows.
    // Some lit at night (deterministic pseudo-random pattern). Optional rooftop element.
    skyscraper(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // edge highlights/shadows
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.22));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // very faint vertical seam suggesting panel divisions
      const seamX = bx + Math.floor(h.w * 0.5);
      px(ctx, seamX, by, 1, h.h, shade(h.body, -0.08));

      // window grid
      const cellW = h.cellW || 3;
      const cellH = h.cellH || 3;
      const cols = Math.max(2, Math.floor((h.w - 2) / cellW));
      const rows = Math.max(3, Math.floor((h.h - 4) / cellH));
      const winW = Math.max(1, cellW - 1);
      const winH = Math.max(1, cellH - 1);
      const lit = (!state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73);
      const litHash = (c, r) => {
        const v = Math.sin((c * 13.7 + r * 17.3 + h.x * 31.1 + h.w * 7.9) * 1.0) * 9301.31;
        return v - Math.floor(v);
      };

      const innerX0 = bx + Math.floor((h.w - cols * cellW) / 2) + 1;
      const innerY0 = by + 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const wx = innerX0 + c * cellW;
          const wy = innerY0 + r * cellH;
          const isLit = lit && litHash(c, r) > 0.45;
          let winColor;
          if (isLit) {
            // varied warm tones
            const tone = litHash(r, c);
            winColor = tone > 0.7 ? '#f0d8a4' : tone > 0.35 ? '#f0c878' : '#e8a868';
          } else {
            winColor = lit ? shade(h.body, -0.35) : shade(h.body, -0.18);
          }
          px(ctx, wx, wy, winW, winH, winColor);
          if (isLit) {
            ctx.fillStyle = 'rgba(240,200,122,0.12)';
            ctx.fillRect(wx - 1, wy - 1, winW + 2, winH + 2);
          }
        }
      }

      // rooftop element
      if (h.rooftop === 'antenna') {
        const cx = bx + (h.w >> 1);
        px(ctx, cx, by - 5, 1, 5, '#1a1a1a');
        px(ctx, cx - 1, by - 5, 3, 1, '#1a1a1a');
        // red blinking aircraft light
        if (Math.floor(state.time * 1.2) % 2 === 0) {
          px(ctx, cx, by - 6, 1, 1, '#ff4040');
          ctx.fillStyle = 'rgba(255,80,80,0.25)';
          ctx.fillRect(cx - 1, by - 7, 3, 3);
        }
      } else if (h.rooftop === 'sign') {
        // neon sign on rooftop
        const sigColor = h.signColor || '#e64a64';
        const sigW = Math.max(4, h.w - 4);
        const sigX = bx + Math.floor((h.w - sigW) / 2);
        if (lit) {
          // glow halo
          ctx.fillStyle = `rgba(230,90,140,0.18)`;
          ctx.fillRect(sigX - 3, by - 6, sigW + 6, 6);
          px(ctx, sigX, by - 4, sigW, 2, sigColor);
          px(ctx, sigX + 1, by - 4, sigW - 2, 1, shade(sigColor, 0.3));
        } else {
          px(ctx, sigX, by - 4, sigW, 2, shade(sigColor, -0.25));
        }
      } else if (h.rooftop === 'tank') {
        // rooftop water tank
        const tx = bx + Math.floor(h.w * 0.3);
        px(ctx, tx, by - 4, 5, 4, '#5a5e6a');
        px(ctx, tx, by - 4, 5, 1, '#7a7e8a');
        px(ctx, tx + 1, by - 5, 3, 1, '#5a5e6a');
      }

      // ground-floor entrance (lit lobby)
      if (h.entrance) {
        const eW = Math.min(h.w - 2, 5);
        const eH = 4;
        const eX = bx + Math.floor((h.w - eW) / 2);
        const eY = by + h.h - eH;
        const entLit = lit ? '#f0c878' : '#3a3e48';
        px(ctx, eX, eY, eW, eH, entLit);
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.25)';
          ctx.fillRect(eX - 2, eY - 2, eW + 4, eH + 3);
        }
      }
    },
  };

  // Tree drawing styles. Signature: (ctx, bx, by, t, sway)
  const TREE_STYLES = {
    pine(ctx, bx, by, t, sway) {
      px(ctx, bx + (t.w>>1) - 1, by, 2, 4, '#2a1810');
      const layers = Math.floor(t.h / 3);
      for (let i = 0; i < layers; i++) {
        const lw = t.w - i * 1.5;
        const ly = by - 2 - i * 3;
        const offset = Math.round(sway * (i + 1) * 0.5);
        px(ctx, bx + Math.round((t.w - lw) / 2) + offset, ly, Math.round(lw), 3, i % 2 === 0 ? '#2c4a2a' : '#1f3820');
      }
      if (state.snowIntensity > 0.3) {
        const alpha = Math.min(0.9, state.snowIntensity);
        ctx.fillStyle = `rgba(240,244,252,${alpha})`;
        for (let i = 0; i < layers; i += 2) {
          const lw = t.w - i * 1.5;
          const ly = by - 2 - i * 3;
          const offset = Math.round(sway * (i + 1) * 0.5);
          ctx.fillRect(bx + Math.round((t.w - lw) / 2) + offset, ly, Math.round(lw), 1);
        }
      }
    },

    // Baobab: massively thick stout trunk with sparse crown of twisted branches
    baobab(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      const trunkH = Math.floor(t.h * 0.55);
      const trunkW = Math.max(3, Math.floor(t.w * 0.6));
      // fat trunk (slightly bulbous)
      for (let y = 0; y < trunkH; y++) {
        const yT = y / trunkH;
        const bulge = Math.sin(yT * Math.PI) * 0.8;
        const w = Math.max(3, trunkW + Math.round(bulge));
        const tx = cx - (w >> 1);
        px(ctx, tx, by - y, w, 1, '#7a5c3a');
        if (y % 3 === 0) {
          px(ctx, tx + 1, by - y, 1, 1, '#5a3e22');
        }
        // shadow side
        px(ctx, tx + w - 1, by - y, 1, 1, '#3a2818');
      }
      // crown — sparse twisted branches with tufts of leaves
      const crownY = by - trunkH;
      const swayC = Math.round(sway * 0.6);
      // main branches
      const branches = [
        [-3, -1, 3], [-4, -3, 2], [0, -3, 3], [4, -3, 2], [3, -1, 3],
      ];
      for (const [bdx, bdy, len] of branches) {
        for (let i = 0; i < len; i++) {
          const fx = cx + Math.round(bdx * (1 + i * 0.25)) + swayC;
          const fy = crownY + bdy - i;
          px(ctx, fx, fy, 1, 1, '#5a3e22');
        }
      }
      // sparse leaf tufts at branch tips
      const leafTips = [
        [-5, -3], [-4, -5], [0, -6], [4, -5], [5, -3],
      ];
      for (const [ldx, ldy] of leafTips) {
        px(ctx, cx + ldx + swayC, crownY + ldy, 2, 1, '#3a5a2a');
        px(ctx, cx + ldx + swayC, crownY + ldy - 1, 1, 1, '#4a6a3a');
      }
    },

    // Palm: slim curved trunk, drooping frond crown
    palm(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      const trunkH = Math.floor(t.h * 0.72);
      const lean = ((t.x % 7) - 3) * 0.25;
      // trunk
      for (let y = 0; y < trunkH; y++) {
        const yT = y / trunkH;
        const leanX = Math.round(lean * yT * 2);
        const swayX = Math.round(sway * yT * 0.7);
        px(ctx, cx + leanX + swayX, by - y, 1, 1, '#7a5430');
        // joint rings
        if (y > 1 && y % 3 === 0) px(ctx, cx + leanX + swayX, by - y, 1, 1, '#4a2e1a');
      }
      // crown base point
      const ty = by - trunkH;
      const tx = cx + Math.round(lean * 1.4);
      const swayC = Math.round(sway * 0.9);
      // fronds: lay out around the crown, drooping outward
      const frondPaths = [
        // [endDx, endDy, midDx, midDy]
        [-4, 0,  -2, -1],
        [ 4, 0,   2, -1],
        [-3, 2,  -2,  0],
        [ 3, 2,   2,  0],
        [-2, -3, -1, -2],
        [ 2, -3,  1, -2],
        [ 0, -4,  0, -2],
      ];
      for (const [edx, edy, mdx, mdy] of frondPaths) {
        // 2-3 pixel curve from crown out
        const c1 = '#3a5a26';
        const c2 = '#2a4818';
        px(ctx, tx + Math.round(mdx * 0.5) + swayC, ty + Math.round(mdy * 0.5), 1, 1, c1);
        px(ctx, tx + mdx + swayC, ty + mdy, 1, 1, c1);
        px(ctx, tx + edx + swayC, ty + edy, 1, 1, c2);
        // mid drooping pixel
        if (Math.abs(edx) > 2) {
          px(ctx, tx + Math.round((mdx + edx) / 2) + swayC, ty + Math.round((mdy + edy) / 2), 1, 1, c1);
        }
      }
      // coconuts (deterministic)
      if ((t.x % 4) === 0) {
        px(ctx, tx - 1 + swayC, ty + 1, 1, 1, '#5a3a18');
        px(ctx, tx + 1 + swayC, ty + 1, 1, 1, '#5a3a18');
      }
    },

    // Spruce: narrow conifer with darker green. Snow caps when t.alwaysSnow or weather snowing.
    spruce(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      // trunk
      px(ctx, cx - 1, by - 2, 2, 4, '#2a1a10');
      const layers = Math.max(3, Math.floor(t.h / 2));
      const wantsSnow = t.alwaysSnow !== false ? true : (state.snowIntensity > 0.1);
      const snowAlpha = t.alwaysSnow === false ? Math.min(0.88, state.snowIntensity) : 0.88;
      for (let i = 0; i < layers; i++) {
        const lw = Math.max(2, t.w - Math.floor(i * 0.6));
        const ly = by - 4 - i * 2;
        const offset = Math.round(sway * (i + 1) * 0.35);
        const sx = bx + Math.round((t.w - lw) / 2) + offset;
        // dark spruce green
        px(ctx, sx, ly, lw, 2, i % 2 === 0 ? '#1f3a20' : '#152810');
        // snow cap on top of each tier
        if (wantsSnow) {
          ctx.fillStyle = `rgba(248,250,255,${snowAlpha})`;
          ctx.fillRect(sx, ly, lw, 1);
        }
      }
      // snow piled at base
      if (wantsSnow) {
        ctx.fillStyle = `rgba(240,246,252,${snowAlpha * 0.8})`;
        ctx.fillRect(bx, by + 1, t.w, 1);
      }
    },

    // Cypress: tall narrow dark-green pyramid with subtle swell near the middle
    cypress(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      for (let y = 0; y < t.h; y++) {
        const yT = y / t.h;
        // width: narrow top, widest at yT≈0.45, tapering to base
        const wT = Math.min(1, 1.6 - Math.abs(yT - 0.5) * 1.8);
        const halfW = Math.max(0, Math.round((t.w / 2) * wT));
        const swayX = Math.round(sway * yT * 1.1);
        const c = y % 3 === 0 ? '#2a4828' : (y % 3 === 1 ? '#1f3820' : '#2e4e2c');
        px(ctx, cx - halfW + swayX, by - y, halfW * 2 + 1, 1, c);
      }
      // crown tip
      px(ctx, cx + Math.round(sway * 1.1), by - t.h - 1, 1, 1, '#1c3418');
      // base shadow
      px(ctx, cx - 1, by + 1, 3, 1, '#1a1812');
    },

    // Olive: short gnarled trunk + low round silvery-green canopy
    olive(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      const trunkH = Math.floor(t.h * 0.35);
      for (let y = 0; y < trunkH; y++) {
        const wobble = Math.round(Math.sin(y * 0.7 + t.x) * 0.5);
        px(ctx, cx + wobble, by - y, 1, 1, '#5a3a22');
        if (y > 1) px(ctx, cx + wobble + 1, by - y, 1, 1, '#3a2412');
      }
      const canopyBase = by - trunkH;
      const canopyH = Math.floor(t.h * 0.7);
      const canopyR = Math.max(3, (t.w / 2) + 1);
      const swayX = Math.round(sway * 0.6);
      const hash = (a, b) => {
        const v = Math.sin((a * 14.13 + b * 27.17 + t.x * 5.7) * 1.0) * 4321.0;
        return v - Math.floor(v);
      };
      for (let dy = -canopyH; dy <= 1; dy++) {
        const yT = (dy + canopyH) / canopyH;
        const r = canopyR * Math.sqrt(Math.max(0, 1 - Math.pow((yT - 0.45) * 1.7, 2)));
        if (r < 0.5) continue;
        for (let dx = -Math.round(r); dx <= Math.round(r); dx++) {
          const d = hash(dx, dy);
          if (d > 0.35) {
            const c = d > 0.8 ? '#8aa874' : (d > 0.6 ? '#6a8a5a' : '#4a6a3e');
            px(ctx, cx + dx + swayX, canopyBase + dy, 1, 1, c);
          }
        }
      }
    },

    // Bamboo: cluster of tall slim green stalks with node bands and tip leaves
    bamboo(ctx, bx, by, t, sway) {
      const stalks = Math.max(3, Math.floor(t.w * 0.7));
      for (let s = 0; s < stalks; s++) {
        const offsetX = (s - (stalks - 1) / 2) * (t.w / stalks);
        const baseX = bx + (t.w >> 1) + Math.round(offsetX);
        const heightVar = ((s * 13) % 5) - 2;  // -2..2
        const stalkH = Math.max(6, t.h + heightVar);
        const swayDir = s % 2 === 0 ? 1 : -1;
        const stalkSway = sway * swayDir * 0.6;
        for (let y = 0; y < stalkH; y++) {
          const yT = y / stalkH;
          const swayX = Math.round(stalkSway * yT * yT * 1.5);
          const isNode = y > 0 && y % 5 === 0;
          const c = isNode ? '#2a4218' : (y % 2 === 0 ? '#5e7e36' : '#4a6a2a');
          px(ctx, baseX + swayX, by - y, 1, 1, c);
          // subtle highlight on right
          if (y > 1 && y % 5 !== 0) px(ctx, baseX + swayX + 1, by - y, 1, 1, '#7a9a4a');
        }
        // tip leaves
        const topY = by - stalkH;
        const topSwayX = Math.round(stalkSway * 1.5);
        px(ctx, baseX + topSwayX, topY - 1, 1, 1, '#7aa84a');
        px(ctx, baseX + topSwayX - 1, topY, 1, 1, '#5a8a3a');
        px(ctx, baseX + topSwayX + 1, topY, 1, 1, '#5a8a3a');
        if (s % 2 === 0) {
          px(ctx, baseX + topSwayX - 2, topY + 2, 1, 1, '#5a8a3a');
          px(ctx, baseX + topSwayX + 2, topY + 1, 1, 1, '#5a8a3a');
        }
      }
    },

    // Eucalyptus (gum): tall slim trunk with sparse silver-green canopy
    gum(ctx, bx, by, t, sway) {
      const cx = bx + (t.w >> 1);
      const trunkH = Math.floor(t.h * 0.55);
      const swayBase = sway * 0.7;
      // trunk — pale eucalypt bark with subtle wobble
      for (let y = 0; y < trunkH; y++) {
        const yT = y / trunkH;
        const wobble = Math.round(Math.sin(y * 0.45 + t.x * 0.3) * 0.4);
        const swayX = Math.round(swayBase * yT);
        px(ctx, cx + wobble + swayX, by - y, 1, 1, '#b0a288');
        // darker side hint
        if (y > 3 && y % 5 !== 0) px(ctx, cx + wobble + swayX - 1, by - y, 1, 1, '#7a6a52');
      }
      // canopy — sparse stippled silver-green
      const canopyBase = by - trunkH;
      const canopyH = Math.floor(t.h * 0.55);
      const canopyR = Math.max(3, (t.w >> 1) + 2);
      const hash = (a, b) => {
        const v = Math.sin((a * 12.9898 + b * 78.233 + t.x * 7.13) * 1.0) * 43758.5453;
        return v - Math.floor(v);
      };
      for (let dy = -canopyH; dy <= 1; dy++) {
        const yT = (dy + canopyH) / canopyH; // 0 top → 1 bottom
        const r = canopyR * (1 - Math.abs(yT - 0.55) * 1.4);
        if (r < 0.5) continue;
        for (let dx = -Math.round(r); dx <= Math.round(r); dx++) {
          const density = hash(dx * 7.1, dy * 11.3);
          if (density > 0.55) {
            const swayX = Math.round(swayBase * (1 - yT) * 1.4);
            // 3 tones for depth
            const c = density > 0.85 ? '#8aa476' :
                      density > 0.72 ? '#5a7a4a' :
                                       '#3e5a36';
            px(ctx, cx + dx + swayX, canopyBase + dy, 1, 1, c);
          }
        }
      }
    },
  };

  // Scene library — palette + house & tree layouts.
  const SCENES = {

      palette: {
        hillFar: '#5a7b8c', hillFarDark: '#2e3a4f', nightFar: '#272e44',

        hillNear: '#345234', hillNearDark: '#15201a', nightNear: '#101a12',

      houses: [

        { style: 'cottage', x: 26,  y: 92, w: 14, h: 12, roofH: 5,  body: '#8c6a4a', roof: '#2f1d12', windows: [{x:3,y:3,w:3,h:3}, {x:8,y:3,w:3,h:3}] },
        { style: 'cottage', x: 42,  y: 88, w: 22, h: 16, roofH: 8,  body: '#a6735c', roof: '#3a1f14', windows: [{x:4,y:5,w:4,h:4}, {x:11,y:5,w:4,h:4}, {x:11,y:11,w:4,h:4}], chimney: { x: 15, y: -5, w: 3, h: 7 } },

    // Wollongong beach view — beach houses on sand with ocean horizon and escarpment behind
    'aussie-wollongong': {
      name: 'Wollongong beach',
      palette: {
        hillFar: '#5a7a8a', hillFarDark: '#283848', nightFar: '#142030',
        hillMid: '#4a6a4a', hillMidDark: '#1e2e22', nightMid: '#0e1a14',
        hillNear: '#e8d8a0', hillNearDark: '#7a6438', nightNear: '#241a10',
        ocean: '#3a7aa8', oceanDark: '#1f3a58', oceanNight: '#15263c',
      },
      // custom backdrop: ocean horizon in the back, sandy beach in front, escarpment ridge
      backdrop(ctx, vx, vy, vw, vh, dayMix) {
        const p = SCENES['aussie-wollongong'].palette;
        const oceanColor = state.isDay
          ? lerpColor(hex(p.ocean), hex(p.oceanDark), 1 - dayMix)
          : p.oceanNight;
        const horizonHi = shade(oceanColor, 0.22);
        const fog = state.fogIntensity;
        const fogged = (c) => {
          if (fog < 0.01) return c;
          const arr = (typeof c === 'string' && c.startsWith('#')) ? hex(c) : parseRgb(c);
          const f = hex('#cfd6dc');
          return `rgb(${Math.round(lerp(arr[0], f[0], fog))},${Math.round(lerp(arr[1], f[1], fog))},${Math.round(lerp(arr[2], f[2], fog))})`;
        };
        // Escarpment (Illawarra cliffs/hills in the far distance)
        const escarp = state.isDay
          ? lerpColor(hex(p.hillFar), hex(p.hillFarDark), 1 - dayMix)
          : p.nightFar;
        for (let x = 0; x < vw; x++) {
          const ridge = Math.round(Math.sin(x * 0.04) * 3 + Math.sin(x * 0.11) * 1);
          const top = 56 + ridge;
          ctx.fillStyle = fogged(escarp);
          ctx.fillRect(vx + x, vy + top, 1, 64 - top + 8);
        }
        // Treeline on the escarpment
        const treeColor = state.isDay
          ? lerpColor(hex(p.hillMid), hex(p.hillMidDark), 1 - dayMix)
          : p.nightMid;
        for (let x = 0; x < vw; x++) {
          if (Math.sin(x * 0.5) > 0.3 && Math.cos(x * 0.31) > -0.2) {
            const ridge = Math.round(Math.sin(x * 0.04) * 3 + Math.sin(x * 0.11) * 1);
            const top = 56 + ridge - 1;
            ctx.fillStyle = fogged(treeColor);
            ctx.fillRect(vx + x, vy + top, 1, 2);
          }
        }

        // Ocean stripe between escarpment and beach
        const horizonY = 68;
        const beachY = 92;
        for (let y = horizonY; y < beachY; y++) {
          const t = (y - horizonY) / (beachY - horizonY);
          const arr = hex(typeof horizonHi === 'string' && horizonHi.startsWith('#') ? horizonHi : '#5a8aaa');
          const arr2 = (typeof oceanColor === 'string' && oceanColor.startsWith('#')) ? hex(oceanColor) : parseRgb(oceanColor);
          const r = Math.round(lerp(arr[0], arr2[0], t));
          const g = Math.round(lerp(arr[1], arr2[1], t));
          const b = Math.round(lerp(arr[2], arr2[2], t));
          ctx.fillStyle = fogged(`rgb(${r},${g},${b})`);
          ctx.fillRect(vx, vy + y, vw, 1);
        }
        // wave hints on the ocean
        const waveT = state.time;
        const oceanHi = shade(oceanColor, 0.32);
        const capBright = state.isDay ? '#f4f8fc' : '#bcc8d8';
        const capSoft   = state.isDay ? '#d8e4ec' : '#8a9aae';
        const bands = [
          { y: horizonY + 3,  amp: 0.5, speed: 5, dash: 4, gap: 7, cap: oceanHi },
          { y: horizonY + 9,  amp: 0.7, speed: 7, dash: 4, gap: 6, cap: capSoft },
          { y: horizonY + 16, amp: 0.9, speed: 9, dash: 5, gap: 5, cap: capBright },
        ];
        for (const b of bands) {
          const drift = (waveT * b.speed) % (b.dash + b.gap);
          for (let x = -drift; x < vw; x += b.dash + b.gap) {
            const yWobble = Math.sin((x + waveT * b.speed * 0.7) * 0.15) * b.amp;
            const yLine = Math.round(b.y + yWobble);
            if (yLine > horizonY && yLine < beachY) {
              const startX = Math.max(0, Math.floor(x));
              const endX = Math.min(vw, Math.floor(x + b.dash));
              if (endX > startX) {
                ctx.fillStyle = fogged(b.cap);
                ctx.fillRect(vx + startX, vy + yLine, endX - startX, 1);
              }
            }
          }
        }
        // foam at the shore
        for (let x = 0; x < vw; x++) {
          const pulse = Math.sin((x + waveT * 7) * 0.4) + Math.sin((x + waveT * 4) * 0.7);
          if (pulse > 0.5) {
            px(ctx, vx + x, vy + beachY - 1, 1, 1, fogged('#cae0ec'));
          }
        }
        // sandy beach foreground
        const sandColor = state.isDay
          ? lerpColor(hex(p.hillNear), hex(p.hillNearDark), 1 - dayMix)
          : p.nightNear;
        ctx.fillStyle = fogged(sandColor);
        ctx.fillRect(vx, vy + beachY, vw, vh - beachY);
        // sand grain texture
        for (let i = 0; i < 50; i++) {

    // Nobbys Lighthouse, Newcastle NSW — a one-off scene for Craig's home.
    // White lighthouse + keeper's quarters on a grassy headland rising from the ocean.
    'nobbys-lighthouse': {
      name: "Nobbys Lighthouse",
      palette: {
        // unused by default backdrop (we use a custom one) but kept for fallback
        hillFar: '#7a8a96', hillFarDark: '#3a4a52', nightFar: '#2c3340',
        hillMid: '#4a7860', hillMidDark: '#2a4232', nightMid: '#142820',
        hillNear: '#3a6a52', hillNearDark: '#1a3024', nightNear: '#101a14',
        // ocean / headland / rocks (used by backdrop)
        ocean: '#3a7aa8', oceanDark: '#1f3a58', oceanNight: '#15263c',
        headland: '#5a8a4a', headlandDark: '#1a3018', headlandNight: '#162818',
        rocks: '#5a4a3a', rocksNight: '#1c1812',
      },
      backdrop(ctx, vx, vy, vw, vh, dayMix) {
        const p = SCENES['nobbys-lighthouse'].palette;
        const oceanColor = state.isDay
          ? lerpColor(hex(p.ocean), hex(p.oceanDark), 1 - dayMix)
          : p.oceanNight;
        const horizonHi = shade(oceanColor, 0.22);
        const headColor = state.isDay
          ? lerpColor(hex(p.headland), hex(p.headlandDark), 1 - dayMix)
          : p.headlandNight;
        const headHighlight = shade(headColor, 0.18);
        const headDark = shade(headColor, -0.28);
        const rockColor = state.isDay ? p.rocks : p.rocksNight;
        const fog = state.fogIntensity;
        const fogged = (c) => {
          if (fog < 0.01) return c;
          const arr = (typeof c === 'string' && c.startsWith('#')) ? hex(c) : parseRgb(c);
          const f = hex('#cfd6dc');
          return `rgb(${Math.round(lerp(arr[0], f[0], fog))},${Math.round(lerp(arr[1], f[1], fog))},${Math.round(lerp(arr[2], f[2], fog))})`;
        };

        const horizonY = 64;
        // ocean fill (slightly lighter near horizon)
        for (let y = horizonY; y < vh; y++) {
          const t = (y - horizonY) / (vh - horizonY);
          const arr = hex(typeof horizonHi === 'string' && horizonHi.startsWith('#') ? horizonHi : '#5a8aaa');
          const arr2 = (typeof oceanColor === 'string' && oceanColor.startsWith('#')) ? hex(oceanColor) : parseRgb(oceanColor);
          const r = Math.round(lerp(arr[0], arr2[0], t));
          const g = Math.round(lerp(arr[1], arr2[1], t));
          const b = Math.round(lerp(arr[2], arr2[2], t));
          ctx.fillStyle = fogged(`rgb(${r},${g},${b})`);
          ctx.fillRect(vx, vy + y, vw, 1);
        }
        // Headland profile defined early so foam loop can use it.
        const peakX = vw * 0.52;
        const peakL = peakX - vw * 0.18;
        const peakR = peakX + vw * 0.12;
        const peakH = 40;
        const profile = (x) => {
          if (x < peakL - vw * 0.18) return 0;
          if (x > peakR + vw * 0.4) return 0;
          if (x < peakL) {
            const t = (x - (peakL - vw * 0.18)) / (vw * 0.18);
            return Math.max(0, Math.round(peakH * Math.pow(Math.max(0, t), 0.8)));
          }
          if (x > peakR) {
            const t = (x - peakR) / (vw * 0.4);
            return Math.max(0, Math.round(peakH * Math.pow(Math.max(0, 1 - t), 1.3)));
          }
          return peakH;
        };

        // Animated wave crests — graduated white caps. Distant bands stay subtle ocean-toned
        // ripples; near bands break into frothy white caps.
        const waveT = state.time;
        const oceanHi = shade(oceanColor, 0.32);
        // White-cap colour, slightly muted at night so it doesn't glow.
        const capBright = state.isDay ? '#f4f8fc' : '#bcc8d8';
        const capSoft   = state.isDay ? '#d8e4ec' : '#8a9aae';
        const bands = [
          // distant: subtle ocean-toned ripple, no white
          { y: 5,  amp: 0.6, freq: 0.18, speed: 6,  dash: 4, gap: 7,  cap: oceanHi,   foamWidth: 0 },
          // mid-distant: tiny white tips
          { y: 12, amp: 0.8, freq: 0.15, speed: 8,  dash: 4, gap: 6,  cap: capSoft,   foamWidth: 0 },
          // mid: clearer white
          { y: 20, amp: 1.0, freq: 0.13, speed: 10, dash: 5, gap: 6,  cap: capBright, foamWidth: 0 },
          // near: chunky foamy crests with a soft foam halo on top
          { y: 28, amp: 1.4, freq: 0.11, speed: 12, dash: 6, gap: 5,  cap: capBright, foamWidth: 1 },
        ];
        for (const b of bands) {
          const drift = (waveT * b.speed) % (b.dash + b.gap);
          for (let x = -drift; x < vw; x += b.dash + b.gap) {
            const yWobble = Math.sin((x + waveT * b.speed * 0.7) * b.freq) * b.amp;
            const yLine = horizonY + b.y + Math.round(yWobble);
            if (yLine <= horizonY + 1 || yLine >= vh - 1) continue;
            const startX = Math.max(0, Math.floor(x));
            const endX = Math.min(vw, Math.floor(x + b.dash));
            if (endX <= startX) continue;
            // main crest line
            ctx.fillStyle = fogged(b.cap);
            ctx.fillRect(vx + startX, vy + yLine, endX - startX, 1);
            // soft foam halo above the crest for the chunkiest near-shore wave
            if (b.foamWidth > 0 && yLine - 1 > horizonY) {
              ctx.fillStyle = fogged(capSoft);
              ctx.fillRect(vx + startX + 1, vy + yLine - 1, Math.max(0, endX - startX - 2), 1);
            }
          }
        }
        // foam at the rocks where the headland meets the water — a moving bright frill
        for (let x = 0; x < vw; x++) {
          const ph = profile(x);
          if (ph <= 0) continue;
          // foam pulse — sin wave + drift, brightening occasionally
          const pulse = Math.sin((x + waveT * 8) * 0.4) + Math.sin((x + waveT * 5) * 0.7);
          if (pulse > 0.5) {
            px(ctx, vx + x, vy + horizonY + 1, 1, 1, fogged('#cae0ec'));
            if (pulse > 1.0 && horizonY + 2 < vh) {
              px(ctx, vx + x, vy + horizonY + 2, 1, 1, fogged('#a0c0d0'));
            }
          }
        }
        // distant horizon shimmer (single bright line near the horizon)
        for (let x = 0; x < vw; x += 6) {
          if (Math.sin((x + waveT * 3) * 0.2) > 0.5) {
            px(ctx, vx + x, vy + horizonY + 2, 2, 1, fogged(shade(oceanColor, 0.4)));
          }
        }

        // grass headland — flat base colour with crest highlight + base shadow strip
        for (let x = 0; x < vw; x++) {
          const ph = profile(x);
          if (ph <= 0) continue;
          const topY = vy + horizonY - ph;
          ctx.fillStyle = fogged(headColor);
          ctx.fillRect(vx + x, topY, 1, ph + 4);
          // crest highlight (top 1-2 rows of grass catching light)
          px(ctx, vx + x, topY, 1, 1, fogged(headHighlight));
          if (ph > 4) px(ctx, vx + x, topY + 1, 1, 1, fogged(shade(headColor, 0.06)));
          // base shadow strip (1-2 rows above the rocks, suggesting cliff darkness)
          if (ph > 5) {
            px(ctx, vx + x, vy + horizonY - 1, 1, 1, fogged(headDark));
          }
        }
        // rocky base at the water-headland interface
        for (let x = 0; x < vw; x++) {
          const ph = profile(x);
          if (ph <= 0) continue;
          const rockY = vy + horizonY + Math.round(Math.sin(x * 0.6) * 1);
          px(ctx, vx + x, rockY, 1, 2, fogged(rockColor));
          // small rock above water
          if ((x % 11) === 0) px(ctx, vx + x, rockY - 1, 2, 1, fogged(shade(rockColor, 0.15)));
        }
        // breakwater wall to the right (extends along the right slope's base)
        for (let x = Math.floor(vw * 0.62); x < vw; x++) {
          const ph = profile(x);
          if (ph > 4) continue; // only where slope is low
          px(ctx, vx + x, vy + horizonY + 1, 1, 2, fogged('#3a3a3a'));
          if ((x % 4) === 0) px(ctx, vx + x, vy + horizonY + 2, 1, 1, fogged('#5a5a5a'));
        }
      },
      houses: [
        // lighthouse at the headland peak (base at y=27 since peak top ≈ y=24)

        // smaller equipment shed further right (still on plateau)
        { style: 'keeper', x: 117, y: 22, w: 9, h: 6, roofH: 2, body: '#e8e0d0', roof: '#4a4a4a', windows: [{x:2,y:2,w:2,h:2}] },

      // Custom skyline backdrop — rectangular building silhouettes instead of sin-wave hills
      backdrop(ctx, vx, vy, vw, vh, dayMix) {
        const p = SCENES.urban.palette;
        const farColor = state.isDay
          ? lerpColor(hex(p.hillFar), hex(p.hillFarDark), 1 - dayMix)
          : p.nightFar;
        const midColor = state.isDay
          ? lerpColor(hex(p.hillMid), hex(p.hillMidDark), 1 - dayMix)
          : p.nightMid;
        const nearColor = state.isDay
          ? lerpColor(hex(p.hillNear), hex(p.hillNearDark), 1 - dayMix)
          : p.nightNear;
        const fog = state.fogIntensity;
        const fogged = (c) => {
          if (fog < 0.01) return c;
          const arr = c.startsWith('#') ? hex(c) : parseRgb(c);
          const f = hex('#cfd6dc');
          return `rgb(${Math.round(lerp(arr[0], f[0], fog))},${Math.round(lerp(arr[1], f[1], fog))},${Math.round(lerp(arr[2], f[2], fog))})`;
        };

        // distant skyline row (far)
        const drawRow = (baseY, minH, maxH, color, seedOffset) => {
          ctx.fillStyle = fogged(color);
          let x = 0;
          while (x < vw) {
            const seed = Math.sin((x + seedOffset) * 0.31) * 1234.567;
            const r1 = seed - Math.floor(seed);
            const w = 3 + Math.floor(r1 * 5);
            const seed2 = Math.sin((x + seedOffset) * 0.71) * 4321.123;
            const r2 = Math.abs(seed2 - Math.floor(seed2));
            const buildingH = Math.round(minH + (maxH - minH) * r2);
            ctx.fillRect(vx + x, vy + baseY - buildingH, w, vh - (baseY - buildingH));
            // a few faint window lights at night
            if (!state.isDay && r1 > 0.5) {
              ctx.fillStyle = 'rgba(240,200,122,0.5)';
              const winR = Math.sin((x + seedOffset) * 1.7) * 9.7;
              const wr = winR - Math.floor(winR);
              if (wr > 0.5) {
                ctx.fillRect(vx + x + 1 + Math.floor(wr * (w - 2)), vy + baseY - buildingH + 2, 1, 1);
              }
              ctx.fillStyle = fogged(color);
            }
            x += w + 1;
          }
        };

        drawRow(94, 8, 22, farColor, 17);
        drawRow(98, 4, 14, midColor, 73);

        // foreground street
        ctx.fillStyle = fogged(nearColor);
        ctx.fillRect(vx, vy + 104, vw, vh - 104);
        // road centre line (subtle dashed)
        ctx.fillStyle = fogged(shade(nearColor, 0.25));
        for (let dx = 2; dx < vw; dx += 8) {

        // kerb lip
        px(ctx, vx, vy + 105, vw, 1, fogged(shade(nearColor, -0.4)));
