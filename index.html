<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Window</title>
<style>
  :root {
    --bg: #0d0a08;
    --panel: rgba(20, 16, 12, 0.78);
    --panel-border: rgba(255, 220, 170, 0.12);
    --text: #f3e7d3;
    --text-dim: #b9a787;
    --accent: #f0b86a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  body {
    background: radial-gradient(ellipse at center, #1a1410 0%, #050402 100%);
  }
  #stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  #scene-wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    box-shadow: 0 0 60px rgba(0,0,0,0.6) inset, 0 30px 80px rgba(0,0,0,0.6);
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* UI */
  .ui {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: calc(100vw - 32px);
    transition: opacity 0.4s ease;
  }
  .ui.hidden { opacity: 0; pointer-events: none; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.4;
    min-width: 240px;
  }
  .panel .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .search {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .search input {
    flex: 1;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,220,170,0.15);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font: inherit;
    outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search button {
    background: var(--accent);
    color: #1a1208;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .search button:hover { filter: brightness(1.08); }

  .suggestions {
    margin-top: 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 8px;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
  }
  .suggestion:hover { background: rgba(255,220,170,0.08); }
  .suggestion .country { color: var(--text-dim); margin-left: 4px; font-size: 11px; }

  .status .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 2px 0;
    font-variant-numeric: tabular-nums;
  }
  .status .row .k { color: var(--text-dim); }
  .status .location { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .status .desc { color: var(--accent); margin-bottom: 8px; font-size: 12px; }

  .controls {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    gap: 8px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 16px;
    transition: transform 0.15s;
  }
  .icon-btn:hover { transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0); }

  .hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--text-dim);
    font-size: 11px;
    z-index: 5;
    pointer-events: none;
    opacity: 0.7;
  }
  .hint.hidden { opacity: 0; }

  .loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    z-index: 4;
    display: none;
  }
  .loading.show { display: block; }
</style>
</head>
<body>
  <div id="stage">
    <div id="scene-wrap">
      <canvas id="scene" width="320" height="180"></canvas>
      <canvas id="fx" width="320" height="180"></canvas>
    </div>
  </div>

  <div class="ui" id="ui">
    <div class="panel">
      <div class="label">Window onto</div>
      <div class="search">
        <input id="loc-input" type="text" placeholder="Newcastle, Reykjavík, Kyoto…" autocomplete="off">
        <button id="loc-go">Look</button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="panel status" id="status">
      <div class="location" id="loc-name">—</div>
      <div class="desc" id="weather-desc">tuning the view</div>
      <div class="row"><span class="k">temperature</span><span id="temp">—</span></div>
      <div class="row"><span class="k">wind</span><span id="wind">—</span></div>
      <div class="row"><span class="k">local time</span><span id="local-time">—</span></div>
    </div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="hide-ui" title="Hide interface (H)">◐</button>
    <button class="icon-btn" id="fullscreen-btn" title="Fullscreen (F)">⛶</button>
  </div>

  <div class="hint" id="hint">H — hide UI &middot; F — fullscreen</div>
  <div class="loading" id="loading">looking up the sky…</div>

<script>
(() => {
  'use strict';

  // ---------- canvas setup ----------
  const W = 320, H = 180;
  const scene = document.getElementById('scene');
  const fx = document.getElementById('fx');
  const sctx = scene.getContext('2d');
  const fctx = fx.getContext('2d');
  sctx.imageSmoothingEnabled = false;
  fctx.imageSmoothingEnabled = false;

  // ---------- palette helpers ----------
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
  const lerpColor = (c1, c2, t) => {
    const r = Math.round(lerp(c1[0], c2[0], t));
    const g = Math.round(lerp(c1[1], c2[1], t));
    const b = Math.round(lerp(c1[2], c2[2], t));
    return `rgb(${r},${g},${b})`;
  };
  const rgb = (r, g, b) => [r, g, b];
  const hex = (s) => {
    const n = parseInt(s.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };

  // ---------- state ----------
  // weather state drives the whole scene
  const state = {
    location: { name: 'Newcastle', country: 'Australia', country_code: 'AU', admin: 'NSW', lat: -32.9283, lon: 151.7817, tz: 'Australia/Sydney' },
    // outside-world inputs
    weatherCode: 0,        // WMO
    temperatureC: 18,
    windKph: 8,
    isDay: 1,
    sunPhase: 0.5,         // 0=midnight, 0.25=sunrise, 0.5=noon, 0.75=sunset
    // derived
    cloudCover: 0.2,       // 0..1
    rainIntensity: 0,      // 0..1
    snowIntensity: 0,
    fogIntensity: 0,
    hailIntensity: 0,
    lightning: false,
    // animation
    time: 0,
    lastFetch: 0,
    nextFetchAt: 0,
    flashUntil: 0,
    flashStrength: 0,
  };

  // WMO weather code → description + scene derivation
  const WEATHER = {
    0:  { d: 'clear sky',           cloud: 0.05, rain: 0,    snow: 0,    fog: 0,    storm: false },
    1:  { d: 'mostly clear',        cloud: 0.18, rain: 0,    snow: 0,    fog: 0,    storm: false },
    2:  { d: 'partly cloudy',       cloud: 0.45, rain: 0,    snow: 0,    fog: 0,    storm: false },
    3:  { d: 'overcast',            cloud: 0.85, rain: 0,    snow: 0,    fog: 0,    storm: false },
    45: { d: 'fog',                 cloud: 0.6,  rain: 0,    snow: 0,    fog: 0.7,  storm: false },
    48: { d: 'rime fog',            cloud: 0.7,  rain: 0,    snow: 0,    fog: 0.8,  storm: false },
    51: { d: 'light drizzle',       cloud: 0.7,  rain: 0.25, snow: 0,    fog: 0.1,  storm: false },
    53: { d: 'drizzle',             cloud: 0.8,  rain: 0.4,  snow: 0,    fog: 0.15, storm: false },
    55: { d: 'heavy drizzle',       cloud: 0.85, rain: 0.55, snow: 0,    fog: 0.2,  storm: false },
    56: { d: 'freezing drizzle',    cloud: 0.85, rain: 0.4,  snow: 0.1,  fog: 0.2,  storm: false },
    57: { d: 'freezing drizzle',    cloud: 0.9,  rain: 0.5,  snow: 0.15, fog: 0.25, storm: false },
    61: { d: 'light rain',          cloud: 0.85, rain: 0.45, snow: 0,    fog: 0.1,  storm: false },
    63: { d: 'rain',                cloud: 0.9,  rain: 0.7,  snow: 0,    fog: 0.15, storm: false },
    65: { d: 'heavy rain',          cloud: 0.95, rain: 1.0,  snow: 0,    fog: 0.25, storm: false },
    66: { d: 'freezing rain',       cloud: 0.9,  rain: 0.6,  snow: 0.2,  fog: 0.2,  storm: false },
    67: { d: 'freezing rain',       cloud: 0.95, rain: 0.8,  snow: 0.3,  fog: 0.25, storm: false },
    71: { d: 'light snow',          cloud: 0.85, rain: 0,    snow: 0.4,  fog: 0.1,  storm: false },
    73: { d: 'snow',                cloud: 0.9,  rain: 0,    snow: 0.7,  fog: 0.15, storm: false },
    75: { d: 'heavy snow',          cloud: 0.95, rain: 0,    snow: 1.0,  fog: 0.2,  storm: false },
    77: { d: 'snow grains',         cloud: 0.85, rain: 0,    snow: 0.3,  fog: 0.15, storm: false },
    80: { d: 'rain showers',        cloud: 0.7,  rain: 0.5,  snow: 0,    fog: 0.05, storm: false },
    81: { d: 'rain showers',        cloud: 0.8,  rain: 0.75, snow: 0,    fog: 0.1,  storm: false },
    82: { d: 'violent showers',     cloud: 0.9,  rain: 1.0,  snow: 0,    fog: 0.15, storm: false },
    85: { d: 'snow showers',        cloud: 0.85, rain: 0,    snow: 0.6,  fog: 0.1,  storm: false },
    86: { d: 'heavy snow showers',  cloud: 0.95, rain: 0,    snow: 0.9,  fog: 0.15, storm: false },
    95: { d: 'thunderstorm',        cloud: 0.95, rain: 0.7,  snow: 0,    fog: 0.15, storm: true,            hail: 0 },
    96: { d: 'thunderstorm w/ hail',cloud: 0.98, rain: 0.6,  snow: 0,    fog: 0.2,  storm: true,            hail: 0.55 },
    99: { d: 'severe thunderstorm', cloud: 1.0,  rain: 0.7,  snow: 0,    fog: 0.25, storm: true,            hail: 0.85 },
  };

  function applyWeatherCode(code) {
    const w = WEATHER[code] || WEATHER[3];
    state.cloudCover = w.cloud;
    state.rainIntensity = w.rain;
    state.snowIntensity = w.snow;
    state.fogIntensity = w.fog;
    state.lightning = w.storm;
    state.hailIntensity = w.hail || 0;
    state.weatherDesc = w.d;
  }

  // sky color from sun phase + cloud cover
  function getSkyColors() {
    // phase: 0 midnight, 0.25 sunrise, 0.5 noon, 0.75 sunset, 1 midnight
    const p = state.sunPhase;
    // base sky top + horizon for each key moment (clear sky)
    // colors loosely tuned for cozy
    const stops = [
      // midnight
      { p: 0.00, top: hex('#0a0e1f'), mid: hex('#1b1f3a'), bot: hex('#252849') },
      // late night
      { p: 0.18, top: hex('#0e1430'), mid: hex('#2a2750'), bot: hex('#46365e') },
      // sunrise
      { p: 0.25, top: hex('#3a3a72'), mid: hex('#d27a5a'), bot: hex('#f5c178') },
      // morning
      { p: 0.33, top: hex('#5b8ec7'), mid: hex('#a8c8e8'), bot: hex('#f1d8a8') },
      // midday
      { p: 0.50, top: hex('#4e8fc9'), mid: hex('#86b6dc'), bot: hex('#cce2f0') },
      // afternoon
      { p: 0.66, top: hex('#5b8ec7'), mid: hex('#a8c8e8'), bot: hex('#f1d8a8') },
      // sunset
      { p: 0.75, top: hex('#3a4a82'), mid: hex('#d76a4a'), bot: hex('#f3b46a') },
      // dusk
      { p: 0.82, top: hex('#1c1a3d'), mid: hex('#5a3766'), bot: hex('#864a5a') },
      // night
      { p: 1.00, top: hex('#0a0e1f'), mid: hex('#1b1f3a'), bot: hex('#252849') },
    ];
    // find segment
    let a = stops[0], b = stops[stops.length-1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (p >= stops[i].p && p <= stops[i+1].p) { a = stops[i]; b = stops[i+1]; break; }
    }
    const t = (p - a.p) / Math.max(0.0001, b.p - a.p);
    const top = [lerp(a.top[0],b.top[0],t), lerp(a.top[1],b.top[1],t), lerp(a.top[2],b.top[2],t)].map(Math.round);
    const mid = [lerp(a.mid[0],b.mid[0],t), lerp(a.mid[1],b.mid[1],t), lerp(a.mid[2],b.mid[2],t)].map(Math.round);
    const bot = [lerp(a.bot[0],b.bot[0],t), lerp(a.bot[1],b.bot[1],t), lerp(a.bot[2],b.bot[2],t)].map(Math.round);

    // tint toward grey with cloud cover (kept gentle — sky must remain distinct from the warm wall)
    const cloud = state.cloudCover;
    const grey = state.isDay ? hex('#8a96a4') : hex('#3a4060');
    const factor = cloud * 0.35;
    const muddy = (c) => [
      Math.round(lerp(c[0], grey[0], factor)),
      Math.round(lerp(c[1], grey[1], factor)),
      Math.round(lerp(c[2], grey[2], factor)),
    ];
    return { top: muddy(top), mid: muddy(mid), bot: muddy(bot) };
  }

  // ---------- scene geometry ----------
  // window opening on the wall
  const WIN = { x: 56, y: 24, w: 208, h: 116 };
  // outside view (the glass area), inside the window frame
  const VIEW = { x: WIN.x + 6, y: WIN.y + 6, w: WIN.w - 12, h: WIN.h - 12 };
  // sill
  const SILL = { x: WIN.x - 8, y: WIN.y + WIN.h - 4, w: WIN.w + 16, h: 8 };

  // ---------- drawing primitives ----------
  function px(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x|0, y|0, w|0, h|0);
  }

  // ---------- scenes ----------
  // A scene = palette (hill colours) + array of houses + array of trees.
  // Each house/tree has a 'style' that selects a drawing function below.
  // Scene is chosen automatically from the location's country code.

  // shared window renderer (warm lit at night, dark by day)
  function drawWarmWindows(ctx, bx, by, h, opts) {
    opts = opts || {};
    const lit = (!state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73);
    const litColor = lit ? (opts.litColor || '#f0c87a') : (opts.darkColor || '#3a4654');
    const frameColor = opts.frameColor || shade(h.body, -0.4);
    const mullionColor = opts.mullionColor || shade(h.body, -0.5);
    for (const w of h.windows) {
      const wx = bx + w.x, wy = by + w.y;
      px(ctx, wx-1, wy-1, w.w+2, w.h+2, frameColor);
      px(ctx, wx, wy, w.w, w.h, litColor);
      if (!opts.noMullion) {
        px(ctx, wx + (w.w>>1), wy, 1, w.h, mullionColor);
        px(ctx, wx, wy + (w.h>>1), w.w, 1, mullionColor);
      }
      if (lit) {
        ctx.fillStyle = 'rgba(240,200,122,0.18)';
        ctx.fillRect(wx-1, wy-1, w.w+2, w.h+2);
      }
    }
  }
  function drawSimpleDoor(ctx, bx, by, h) {
    if (!h.door) return;
    const d = h.door;
    const dx = bx + d.x, dy = by + d.y;
    px(ctx, dx, dy, d.w, d.h, d.color || shade(h.body, -0.55));
    px(ctx, dx + d.w - 1, dy + (d.h>>1), 1, 1, '#3a2818');
  }

  // House drawing styles. Signature: (ctx, bx, by, h)
  const HOUSE_STYLES = {
    cottage(ctx, bx, by, h) {
      px(ctx, bx, by, h.w, h.h, h.body);
      px(ctx, bx + h.w - 2, by, 2, h.h, shade(h.body, -0.18));
      drawRoof(ctx, bx, by, h.w, h.roofH, h.roof);
      if (h.chimney) {
        const cx = bx + h.chimney.x;
        const cy = by + h.chimney.y;
        px(ctx, cx, cy, h.chimney.w, h.chimney.h, shade(h.roof, -0.1));
        px(ctx, cx, cy, h.chimney.w, 1, shade(h.roof, -0.25));
      }
      drawWarmWindows(ctx, bx, by, h);
      drawSimpleDoor(ctx, bx, by, h);
      if (state.snowIntensity > 0.05) {
        drawRoofSnow(ctx, bx, by, h.w, h.roofH, state.snowIntensity);
      }
      if (h.chimney && state.temperatureC < 12) {
        drawSmoke(ctx, bx + h.chimney.x + (h.chimney.w>>1), by + h.chimney.y, state.time + h.x);
      }
    },

    // Australian weatherboard: horizontal cladding stripes, low-pitch corrugated iron roof
    // with overhang, optional stumps and veranda strip.
    weatherboard(ctx, bx, by, h) {
      // stumps (raised Queenslander)
      if (h.stumps) {
        const sH = 3;
        const sColor = '#3a2618';
        px(ctx, bx + 2, by + h.h, 1, sH, sColor);
        px(ctx, bx + h.w - 3, by + h.h, 1, sH, sColor);
        if (h.w >= 18) px(ctx, bx + (h.w >> 1), by + h.h, 1, sH, sColor);
        // shadow line under house
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(bx + 1, by + h.h + sH, h.w - 2, 1);
      }
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // weatherboard horizontal stripes (every 2 rows)
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        px(ctx, bx, y, h.w, 1, shade(h.body, -0.13));
      }
      // edge shadows
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.24));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));

      // veranda strip near base (railing suggestion)
      if (h.veranda) {
        px(ctx, bx, by + h.h - 3, h.w, 1, shade(h.body, -0.3));
        px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.4));
      }

      // low-pitch corrugated iron roof with overhang
      const roofH = h.roofH || 3;
      const overhang = h.overhang || 2;
      for (let i = 0; i < roofH; i++) {
        const sw = h.w + overhang * 2 - i * 2;
        const sx = bx - overhang + i;
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
      }
      // corrugation streaks on the lowest row
      for (let x = bx - overhang; x < bx + h.w + overhang; x += 2) {
        px(ctx, x, by - 1, 1, 1, shade(h.roof, -0.28));
      }
      // ridge highlight
      if (roofH > 1) {
        const rW = h.w + overhang * 2 - (roofH - 1) * 2;
        const rX = bx - overhang + (roofH - 1);
        if (rW > 0) px(ctx, rX, by - roofH, rW, 1, shade(h.roof, 0.18));
      }
      // small fascia line under the eaves
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.35));

      drawWarmWindows(ctx, bx, by, h);
      drawSimpleDoor(ctx, bx, by, h);
    },

    // Japanese machiya: dark wood plank walls, deep-overhang curved tile roof,
    // shoji paper windows, stone foundation.
    machiya(ctx, bx, by, h) {
      // body — dark wood
      px(ctx, bx, by, h.w, h.h, h.body);
      // vertical plank lines (every 3px)
      for (let x = bx + 2; x < bx + h.w - 1; x += 3) {
        px(ctx, x, by + 1, 1, h.h - 3, shade(h.body, -0.28));
      }
      // top cross-beam
      px(ctx, bx, by, h.w, 1, shade(h.body, -0.45));

      // hipped tile roof with deep overhang — pyramid that narrows toward the ridge
      const roofH = h.roofH || 5;
      const overhang = h.overhang || 4;
      const ridgeColor = shade(h.roof, -0.4);
      const tileColor = h.roof;
      const tileLight = shade(h.roof, 0.12);
      // taper the top by ~55% of width
      const topTaper = Math.round(h.w * 0.55);
      for (let i = 0; i < roofH; i++) {
        const t = roofH > 1 ? i / (roofH - 1) : 0;  // 0 at bottom (widest), 1 at top
        const sw = Math.round(h.w + overhang * 2 - t * (overhang * 2 + topTaper));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        if (sw <= 0) continue;
        // base of step is the tile face
        px(ctx, sx, by - i - 1, sw, 1, tileColor);
        // edge tile shadow (darker line at the bottom of each tile course)
        if (i === 0) px(ctx, sx, by - 1, sw, 1, shade(h.roof, -0.3));
        // tile highlight every other row
        if (i > 0 && i % 2 === 1 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, tileLight);
        }
      }
      // ridge cap (dark line across top of roof)
      const ridgeW = Math.max(2, h.w - topTaper - 2);
      const ridgeX = bx + Math.round((h.w - ridgeW) / 2);
      px(ctx, ridgeX, by - roofH - 1, ridgeW, 1, ridgeColor);
      // ridge end pieces
      px(ctx, ridgeX - 1, by - roofH, 1, 1, ridgeColor);
      px(ctx, ridgeX + ridgeW, by - roofH, 1, 1, ridgeColor);
      // upturned eave hints — small dots at the corners of the lowest course
      px(ctx, bx - overhang - 1, by - 2, 1, 1, tileColor);
      px(ctx, bx + h.w + overhang, by - 2, 1, 1, tileColor);

      // foundation stone
      const foundH = 2;
      px(ctx, bx - 1, by + h.h - foundH, h.w + 2, foundH, '#4a4540');
      px(ctx, bx - 1, by + h.h - foundH, h.w + 2, 1, '#6a6560');

      // shoji paper windows
      const lit = (!state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73);
      const paperColor = lit ? '#f0d8a4' : '#c8c0a8';
      const frameColor = '#2a1a10';
      const dividerColor = shade(paperColor, -0.35);
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // dark wood frame
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, frameColor);
        // paper
        px(ctx, wx, wy, w.w, w.h, paperColor);
        // shoji grid — divisions scale with size
        const cols = w.w >= 6 ? 2 : 1;
        const rows = w.h >= 6 ? 2 : 1;
        for (let i = 1; i <= cols; i++) {
          const x = wx + Math.round(i * w.w / (cols + 1));
          px(ctx, x, wy, 1, w.h, dividerColor);
        }
        for (let i = 1; i <= rows; i++) {
          const y = wy + Math.round(i * w.h / (rows + 1));
          px(ctx, wx, y, w.w, 1, dividerColor);
        }
        // glow when lit
        if (lit) {
          ctx.fillStyle = 'rgba(240,210,140,0.16)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }

      // sliding wood door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, '#2a1a10');
        // dark vertical split (sliding doors)
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#0e0604');
        // light top and bottom rail
        px(ctx, dx, dy, d.w, 1, '#4a2e1c');
        px(ctx, dx, dy + d.h - 1, d.w, 1, '#0a0402');
      }

      if (h.chimney && state.temperatureC < 12) {
        drawSmoke(ctx, bx + h.chimney.x + (h.chimney.w>>1), by + h.chimney.y, state.time + h.x);
      }
    },

    // Mediterranean whitewash: cream stucco cube, terracotta tile or flat parapet roof,
    // blue shutters and accent door.
    whitewash(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // right edge soft shadow
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.18));
      // left edge soft highlight
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.06));
      // base line shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.22));

      if (h.flatRoof) {
        // flat roof with stucco parapet topped by a terracotta capping
        const parH = 2;
        px(ctx, bx - 1, by - parH, h.w + 2, parH, h.body);
        px(ctx, bx - 1, by - parH, h.w + 2, 1, shade(h.body, -0.18));
        // terracotta cap
        px(ctx, bx - 1, by - parH - 1, h.w + 2, 1, h.roof);
      } else {
        // low-pitch terracotta tile roof
        const roofH = h.roofH || 3;
        const overhang = h.overhang || 1;
        for (let i = 0; i < roofH; i++) {
          const sw = h.w + overhang * 2 - i * 2;
          const sx = bx - overhang + i;
          if (sw > 0) {
            px(ctx, sx, by - i - 1, sw, 1, h.roof);
            if (i > 0 && i % 2 === 1 && sw > 4) {
              px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.18));
            }
          }
        }
        // ridge
        if (roofH > 1) {
          const rW = Math.max(1, h.w + overhang * 2 - (roofH - 1) * 2 - 2);
          const rX = bx - overhang + (roofH - 1);
          px(ctx, rX, by - roofH, rW, 1, shade(h.roof, -0.3));
        }
        // dark eave line under tiles
        px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.4));
      }

      // windows — small with blue shutters either side
      const shutterColor = h.shutterColor || '#3a5e8a';
      const shutterShade = shade(shutterColor, -0.25);
      const lit = (!state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73);
      const glassColor = lit ? '#f0c878' : '#2a2e3a';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // dark frame
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, shade(h.body, -0.35));
        // glass
        px(ctx, wx, wy, w.w, w.h, glassColor);
        // shutters
        px(ctx, wx - 2, wy - 1, 1, w.h + 2, shutterColor);
        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutterColor);
        // shutter slat hint (every 2px)
        for (let yy = wy; yy < wy + w.h + 2; yy += 2) {
          px(ctx, wx - 2, yy, 1, 1, shutterShade);
          px(ctx, wx + w.w + 1, yy, 1, 1, shutterShade);
        }
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }

      // accent door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        const dColor = d.color || '#3a5e8a';
        px(ctx, dx, dy, d.w, d.h, dColor);
        // arched top hint
        px(ctx, dx, dy, d.w, 1, shade(dColor, -0.3));
        // dark frame
        px(ctx, dx - 1, dy, 1, d.h, shade(h.body, -0.4));
        px(ctx, dx + d.w, dy, 1, d.h, shade(h.body, -0.4));
        // brass knob
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#d4ae5a');
      }
    },

    // Nordic cabin: falu-red horizontal log body, steep gabled roof always capped with snow,
    // white window frames, accent door.
    cabin(ctx, bx, by, h) {
      // body — falu red wood
      px(ctx, bx, by, h.w, h.h, h.body);
      // horizontal log lines
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        px(ctx, bx, y, h.w, 1, shade(h.body, -0.2));
      }
      // edge shadows
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.28));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // base shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.35));

      // chimney behind roof
      if (h.chimney) {
        const cx = bx + h.chimney.x;
        const cy = by + h.chimney.y;
        px(ctx, cx, cy, h.chimney.w, h.chimney.h, '#2a2624');
        px(ctx, cx, cy, h.chimney.w, 1, '#4a4640');
      }

      // steep gabled roof — proper triangle
      const roofH = h.roofH || 8;
      const roofColor = h.roof;
      for (let i = 0; i < roofH; i++) {
        const t = roofH > 1 ? i / (roofH - 1) : 0;
        const sw = Math.max(1, Math.round(h.w - t * (h.w - 1)));
        const sx = bx + Math.round((h.w - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, roofColor);
      }
      // dark eave under roof
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(roofColor, -0.4));

      // snow cap covering the whole gable — on by default; scenes can set h.noSnow:true
      const wantsSnow = h.noSnow ? (state.snowIntensity > 0.1) : true;
      if (wantsSnow) {
        const snowAlpha = h.noSnow ? Math.min(0.93, state.snowIntensity) : 0.93;
        for (let i = 0; i < roofH; i++) {
          const t = roofH > 1 ? i / (roofH - 1) : 0;
          const sw = Math.max(1, Math.round(h.w - t * (h.w - 1)));
          const sx = bx + Math.round((h.w - sw) / 2);
          ctx.fillStyle = `rgba(252,254,255,${snowAlpha})`;
          ctx.fillRect(sx, by - i - 1, sw, 1);
        }
        // soft blue-grey shadow under the snowy eave
        ctx.fillStyle = `rgba(180,200,222,${snowAlpha * 0.5})`;
        ctx.fillRect(bx - 1, by, h.w + 2, 1);
      }

      // windows with white frames and warm light
      const lit = (!state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73);
      const litColor = lit ? '#f8d878' : '#3a4658';
      const frameColor = '#f0e8d4';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // dark outer border
        px(ctx, wx - 2, wy - 2, w.w + 4, w.h + 4, shade(h.body, -0.5));
        // white frame
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, frameColor);
        // glass
        px(ctx, wx, wy, w.w, w.h, litColor);
        // white cross mullion
        px(ctx, wx + (w.w >> 1), wy, 1, w.h, frameColor);
        px(ctx, wx, wy + (w.h >> 1), w.w, 1, frameColor);
        if (lit) {
          ctx.fillStyle = 'rgba(248,216,122,0.22)';
          ctx.fillRect(wx - 3, wy - 3, w.w + 6, w.h + 6);
        }
      }

      // door (white-cream or accent)
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        const dColor = d.color || '#f0e8d4';
        px(ctx, dx - 1, dy, d.w + 2, d.h, shade(h.body, -0.4));
        px(ctx, dx, dy, d.w, d.h, dColor);
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#a89880');
        // snow pile on stoop
        ctx.fillStyle = 'rgba(252,254,255,0.85)';
        ctx.fillRect(dx - 1, dy + d.h, d.w + 2, 1);
      }

      // smoke from chimney
      if (h.chimney && state.temperatureC < 5) {
        drawSmoke(ctx, bx + h.chimney.x + (h.chimney.w >> 1), by + h.chimney.y, state.time + h.x);
      }
    },

    // Australian Federation / Goldfields heritage — brick/sandstone with bullnose veranda + iron lace
    federation(ctx, bx, by, h) {
      // body — brick or sandstone with mortar pattern
      px(ctx, bx, by, h.w, h.h, h.body);
      if (h.brick !== false) {
        for (let y = by + 2; y < by + h.h - 1; y += 2) {
          const offset = ((y - by) % 4 === 2) ? 2 : 0;
          for (let x = bx + offset; x < bx + h.w; x += 4) {
            px(ctx, x, y, 1, 1, shade(h.body, -0.18));
          }
        }
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.22));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.06));
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.3));

      // hipped roof
      const roofH = h.roofH || 4;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(2, Math.round(h.w + 2 - t * (h.w * 0.55)));
        const sx = bx - 1 + Math.round((h.w + 2 - sw) / 2);
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
        if (i > 0 && i % 2 === 1 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.15));
        }
      }
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.3));

      // ornamental front gable (with finial)
      if (h.frontGable) {
        const gW = Math.max(4, Math.floor(h.w * 0.4));
        const gx = bx + Math.floor((h.w - gW) / 2);
        const gH = Math.max(3, Math.floor(roofH * 0.8));
        for (let i = 0; i < gH; i++) {
          const t = i / Math.max(1, gH - 1);
          const sw = Math.max(1, Math.round(gW - t * (gW - 1)));
          const sx = gx + Math.round((gW - sw) / 2);
          px(ctx, sx, by - i - 1, sw, 1, h.roof);
        }
        // iron cresting finial
        px(ctx, gx + (gW >> 1), by - gH - 1, 1, 2, '#1a1a1a');
      }

      // bullnose veranda extending in front
      if (h.veranda) {
        const verH = h.verandaH || 4;
        const verW = Math.min(h.w + 4, h.verandaW || (h.w + 4));
        const verX = bx + Math.floor((h.w - verW) / 2);
        const verY = by + Math.floor(h.h * 0.4);
        const verRoof = h.verandaRoof || '#9a9a9a';
        // bullnose curved roof
        for (let dx = 0; dx < verW; dx++) {
          const t = dx / Math.max(1, verW - 1);
          const arc = Math.round(Math.sin(t * Math.PI) * 1);
          px(ctx, verX + dx, verY - arc, 1, 1, verRoof);
        }
        // shadow under the bullnose
        px(ctx, verX, verY + 1, verW, 1, shade(verRoof, -0.3));
        // posts
        const postColor = h.postColor || '#3a2818';
        const postBaseY = by + h.h;
        px(ctx, verX, verY + 2, 1, postBaseY - verY - 2, postColor);
        px(ctx, verX + verW - 1, verY + 2, 1, postBaseY - verY - 2, postColor);
        if (verW > 14) {
          px(ctx, verX + Math.floor(verW / 3), verY + 2, 1, postBaseY - verY - 2, postColor);
          px(ctx, verX + Math.floor(2 * verW / 3), verY + 2, 1, postBaseY - verY - 2, postColor);
        }
        // cast iron lacework friezeline (alternating black pixels)
        for (let dx = 1; dx < verW - 1; dx++) {
          if (dx % 2 === 0) px(ctx, verX + dx, verY + 2, 1, 1, '#1a1a1a');
          if (dx % 3 === 0) px(ctx, verX + dx, verY + 3, 1, 1, '#1a1a1a');
        }
        // veranda floor edge
        px(ctx, verX, postBaseY - 1, verW, 1, shade(postColor, 0.2));
      }

      // windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      for (const w of h.windows || []) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        if (w.w >= 3) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a4a3a');
        if (w.h >= 5) px(ctx, wx, wy + (w.h >> 1), w.w, 1, '#5a4a3a');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.16)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      // panelled front door with fanlight
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy - 1, d.w, 1, '#f0e0c0');
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a2418');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#2a1208');
        px(ctx, dx + d.w - 2, dy + (d.h >> 1), 1, 1, '#d4a040');
      }
    },

    // Mine headframe — A-frame steel tower with hoist wheel (Mt Isa / Broken Hill / Kalgoorlie).
    'mine-headframe'(ctx, bx, by, h) {
      const cx = bx + (h.w >> 1);
      const baseY = by + h.h;
      const wheelY = by + 3;
      // outer legs leaning inward
      for (let y = 4; y < h.h; y++) {
        const t = y / h.h;
        const lx = bx + Math.round(t * 1);
        const rx = bx + h.w - 1 - Math.round(t * 1);
        px(ctx, lx, by + y, 1, 1, '#5a5a5a');
        px(ctx, rx, by + y, 1, 1, '#5a5a5a');
      }
      // horizontal cross-members
      for (let y = by + 8; y < baseY - 2; y += 5) {
        px(ctx, bx + 1, y, h.w - 2, 1, '#3a3a3a');
      }
      // diagonal X-bracing in each bay
      for (let y = by + 6; y < baseY - 5; y += 5) {
        for (let dx = 1; dx < h.w - 1; dx++) {
          const dy = Math.floor(dx * 5 / (h.w - 2));
          px(ctx, bx + dx, y + dy, 1, 1, '#3a3a3a');
          px(ctx, bx + dx, y + 4 - dy, 1, 1, '#3a3a3a');
        }
      }
      // top housing (sheave) — wider crown
      px(ctx, cx - 4, wheelY - 2, 9, 4, '#5a5a5a');
      px(ctx, cx - 4, wheelY - 2, 9, 1, '#7a7a7a');
      // hoist wheel
      drawDisc(ctx, cx, wheelY, 2);
      px(ctx, cx, wheelY, 1, 1, '#1a1a1a');
      px(ctx, cx - 2, wheelY, 5, 1, '#8a8a8a');
      // cable going down
      px(ctx, cx, wheelY + 2, 1, h.h - 4, '#1a1a1a');
      // small winding-house base
      px(ctx, bx - 1, baseY - 4, h.w + 2, 4, '#6a6a6a');
      px(ctx, bx - 1, baseY - 4, h.w + 2, 1, '#8a8a8a');
      // small door
      px(ctx, cx - 1, baseY - 3, 2, 3, '#2a2a2a');
      // red blinking aircraft warning light
      if (Math.floor(state.time * 1.2) % 2 === 0) {
        px(ctx, cx, by, 1, 1, '#ff4040');
        ctx.fillStyle = 'rgba(255,80,80,0.25)';
        ctx.fillRect(cx - 1, by - 1, 3, 3);
      }
    },

    // Grain silo — tall cylinder with conical or domed top (paddock prop).
    silo(ctx, bx, by, h) {
      px(ctx, bx, by, h.w, h.h, h.body);
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.12));
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.22));
      // horizontal corrugation bands
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        px(ctx, bx + 1, y, h.w - 2, 1, shade(h.body, -0.12));
      }
      // base ring
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.32));
      // conical top
      const topH = h.topH || 3;
      for (let i = 0; i < topH; i++) {
        const t = i / Math.max(1, topH - 1);
        const sw = Math.max(1, Math.round(h.w - t * (h.w - 1)));
        const sx = bx + Math.round((h.w - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, shade(h.body, -0.18));
      }
      // small vent / cap
      px(ctx, bx + (h.w >> 1), by - topH - 1, 1, 1, '#3a3a3a');
    },

    // Windmill — spinning multi-blade water pump, classic outback prop.
    windmill(ctx, bx, by, h) {
      const poleX = bx + (h.w >> 1);
      const poleColor = '#3a2818';
      // pole
      px(ctx, poleX, by + 5, 1, h.h - 5, poleColor);
      // X bracing along the pole
      for (let dy = 10; dy < h.h; dy += 8) {
        px(ctx, poleX - 1, by + dy, 1, 1, poleColor);
        px(ctx, poleX + 1, by + dy, 1, 1, poleColor);
      }
      // base spread legs
      px(ctx, bx, by + h.h - 1, h.w, 1, poleColor);
      px(ctx, bx + 1, by + h.h - 2, 1, 1, poleColor);
      px(ctx, bx + h.w - 2, by + h.h - 2, 1, 1, poleColor);
      // multi-blade wheel — spin speed scales with wind
      const spin = state.time * (0.4 + state.windKph / 25);
      const headY = by + 5;
      const r = 4;
      const blades = 8;
      for (let i = 0; i < blades; i++) {
        const a = (i / blades) * Math.PI * 2 + spin;
        for (let rr = 1; rr <= r; rr++) {
          const bx2 = poleX + Math.round(Math.cos(a) * rr);
          const by2 = headY + Math.round(Math.sin(a) * rr);
          px(ctx, bx2, by2, 1, 1, rr === r ? '#888888' : '#a8a8a8');
        }
      }
      px(ctx, poleX, headY, 1, 1, '#3a3a3a');
      // tail vane
      px(ctx, poleX + 2, headY - 2, 3, 1, '#5a3a22');
      px(ctx, poleX + 2, headY - 1, 4, 1, '#7a4a2a');
      px(ctx, poleX + 2, headY, 1, 1, '#3a2818');
    },

    // Australian outback tin-shack — corrugated iron walls, low-pitch roof, optional water tank.
    'tin-shack'(ctx, bx, by, h) {
      if (h.stumps) {
        const sH = 3;
        px(ctx, bx + 2, by + h.h, 1, sH, '#3a2618');
        px(ctx, bx + h.w - 3, by + h.h, 1, sH, '#3a2618');
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(bx + 1, by + h.h + sH, h.w - 2, 1);
      }
      // body — corrugated iron (vertical lines)
      px(ctx, bx, by, h.w, h.h, h.body);
      for (let x = bx + 1; x < bx + h.w; x += 2) {
        px(ctx, x, by + 1, 1, h.h - 2, shade(h.body, -0.18));
      }
      // weathered rust streaks (deterministic by h.x)
      for (let i = 0; i < 3; i++) {
        const seed = Math.sin(h.x * 7 + i * 13) * 1000;
        const r = Math.abs(seed - Math.floor(seed));
        const rx = bx + 2 + Math.floor(r * (h.w - 4));
        px(ctx, rx, by + 3, 1, h.h - 4, shade(h.body, -0.32));
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.28));
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.4));

      // low-pitch corrugated metal roof with overhang
      const roofH = h.roofH || 3;
      const overhang = h.overhang || 2;
      for (let i = 0; i < roofH; i++) {
        const sw = h.w + overhang * 2 - i * 2;
        const sx = bx - overhang + i;
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
      }
      // corrugation lines along the eave
      for (let x = bx - overhang; x < bx + h.w + overhang; x += 2) {
        px(ctx, x, by - 1, 1, 1, shade(h.roof, -0.25));
      }
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.35));

      // simple small windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      for (const w of h.windows || []) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#3a2818');
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#d4a040');
      }
      // optional rainwater tank on stand (iconic outback)
      if (h.tank) {
        const tx = bx + h.w + 2;
        const ty = by + h.h - 7;
        px(ctx, tx, ty, 4, 6, '#888888');
        px(ctx, tx, ty, 4, 1, '#a8a8a8');
        px(ctx, tx, ty + 2, 4, 1, shade('#888888', -0.2));
        // legs
        px(ctx, tx, ty + 6, 1, 2, '#3a2618');
        px(ctx, tx + 3, ty + 6, 1, 2, '#3a2618');
      }
    },

    // Australian brick-veneer suburb — single-storey low-pitch brick, attached garage.
    'brick-veneer'(ctx, bx, by, h) {
      const houseW = h.garage ? Math.floor(h.w * 0.62) : h.w;
      const garageW = h.w - houseW;
      // main house body — brick
      px(ctx, bx, by, houseW, h.h, h.body);
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        const offset = ((y - by) % 4 === 2) ? 2 : 0;
        for (let x = bx + offset; x < bx + houseW; x += 4) {
          px(ctx, x, y, 1, 1, shade(h.body, -0.18));
        }
        px(ctx, bx, y - 1, houseW, 1, shade(h.body, -0.1));
      }
      px(ctx, bx + houseW - 1, by, 1, h.h, shade(h.body, -0.22));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.06));
      px(ctx, bx, by + h.h - 1, houseW, 1, shade(h.body, -0.3));

      // hipped tile/colorbond roof (low pitch)
      const roofH = h.roofH || 4;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(2, Math.round(houseW + 2 - t * (houseW * 0.45)));
        const sx = bx - 1 + Math.round((houseW + 2 - sw) / 2);
        if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof);
        if (i > 0 && i % 2 === 1 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.15));
        }
      }
      px(ctx, bx - 1, by - 1, houseW + 2, 1, shade(h.roof, -0.3));

      // attached garage (optional)
      if (h.garage && garageW > 0) {
        const gH = Math.floor(h.h * 0.85);
        const gy = by + h.h - gH;
        const gx = bx + houseW;
        px(ctx, gx, gy, garageW, gH, h.body);
        // brick pattern (lighter to differentiate)
        for (let y = gy + 2; y < gy + gH - 1; y += 2) {
          px(ctx, gx, y - 1, garageW, 1, shade(h.body, -0.1));
        }
        // garage roof (matches main)
        for (let i = 0; i < Math.max(2, roofH - 1); i++) {
          const sw = garageW + 1 - i * 2;
          const sx = gx + i;
          if (sw > 0) px(ctx, sx, gy - i - 1, sw, 1, h.roof);
        }
        // tilt-a-door
        px(ctx, gx + 1, gy + 2, garageW - 2, gH - 3, shade(h.body, -0.45));
        for (let yy = gy + 4; yy < gy + gH - 1; yy += 2) {
          px(ctx, gx + 1, yy, garageW - 2, 1, shade(h.body, -0.6));
        }
      }

      // aluminium-frame sliding windows (the icon of Aussie veneer)
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#9a9a9a');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        // vertical slider divider
        if (w.w >= 4) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#9a9a9a');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.16)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a2418');
        // small awning above
        px(ctx, dx - 1, dy - 1, d.w + 2, 1, shade(h.roof, -0.2));
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#d4a040');
      }
    },

    // Toraja tongkonan — wooden stilted house with iconic upturned boat-shaped roof.
    tongkonan(ctx, bx, by, h) {
      const stiltH = h.stiltH || 5;
      // stilts
      px(ctx, bx + 2, by + h.h, 1, stiltH, '#3a2818');
      px(ctx, bx + h.w - 3, by + h.h, 1, stiltH, '#3a2818');
      if (h.w >= 14) px(ctx, bx + (h.w >> 1), by + h.h, 1, stiltH, '#3a2818');
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(bx + 1, by + h.h + stiltH, h.w - 2, 1);

      // wooden body with vertical plank lines
      px(ctx, bx, by, h.w, h.h, h.body);
      for (let x = bx + 2; x < bx + h.w - 1; x += 3) {
        px(ctx, x, by + 1, 1, h.h - 2, shade(h.body, -0.22));
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.28));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.06));

      // iconic red-cream-black carved belt across the middle
      const beltY = by + Math.floor(h.h * 0.45);
      px(ctx, bx, beltY,     h.w, 1, '#a83824');
      px(ctx, bx, beltY + 1, h.w, 1, '#f0e0c0');
      px(ctx, bx, beltY + 2, h.w, 1, '#1a1008');
      // pattern dots on the cream stripe
      for (let dx = 1; dx < h.w; dx += 3) {
        px(ctx, bx + dx, beltY + 1, 1, 1, '#a83824');
      }

      // Boat-shaped roof — high horns at both ends, low waist in the middle.
      const hornH = h.roofH || 13;
      const centerH = Math.floor(hornH * 0.4);
      for (let x = 0; x < h.w; x++) {
        const t = h.w > 1 ? x / (h.w - 1) : 0;
        const dipFactor = Math.sin(t * Math.PI); // 0 at ends, 1 at middle
        const roofTop = hornH - Math.round((hornH - centerH) * dipFactor);
        for (let dy = 0; dy < 2; dy++) {
          px(ctx, bx + x, by - roofTop + dy, 1, 1, h.roof);
        }
        px(ctx, bx + x, by - roofTop, 1, 1, shade(h.roof, 0.18));
      }
      // upturned horn tips reaching past the body
      px(ctx, bx - 1, by - hornH,     1, 2, h.roof);
      px(ctx, bx + h.w, by - hornH,   1, 2, h.roof);
      px(ctx, bx - 1, by - hornH - 1, 2, 1, '#1a1008');
      px(ctx, bx + h.w - 1, by - hornH - 1, 2, 1, '#1a1008');

      // small glowing window(s)
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      for (const w of h.windows || []) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2418');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a2418');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      // door + ladder
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, '#1a1008');
        for (let i = 0; i < stiltH; i += 2) {
          px(ctx, dx, by + h.h + i, d.w, 1, '#5a3a22');
        }
      }
    },

    // Cape Dutch — white stucco with iconic S-curve scrolled gable (Stellenbosch, Cape Town wine region).
    'cape-dutch'(ctx, bx, by, h) {
      // body — white stucco
      px(ctx, bx, by, h.w, h.h, h.body);
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.18));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.22));

      // S-curve Dutch gable on top — scrolled outline rising to a peak
      const gableH = h.gableH || 10;
      for (let i = 0; i < gableH; i++) {
        const t = gableH > 1 ? i / (gableH - 1) : 0;
        // piecewise S-shape: narrow at base, swelling out for the scrolls, then tapering to peak
        let f;
        if (t < 0.25)      f = 1.0 - t * 1.4;            // 1.0 → 0.65
        else if (t < 0.45) f = 0.65 + (t - 0.25) * 1.5;  // 0.65 → 0.95 (scroll shoulder)
        else if (t < 0.65) f = 0.95 - (t - 0.45) * 1.6;  // 0.95 → 0.63
        else               f = Math.max(0.05, 0.63 - (t - 0.65) * 1.8); // taper to peak
        const sw = Math.max(1, Math.round(h.w * f));
        const sx = bx + Math.round((h.w - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.body);
        px(ctx, sx, by - i - 1, 1, 1, shade(h.body, -0.25));
        px(ctx, sx + sw - 1, by - i - 1, 1, 1, shade(h.body, -0.25));
      }
      // peak finial
      const finX = bx + (h.w >> 1);
      px(ctx, finX, by - gableH - 1, 1, 1, '#3a2818');

      // dark thatched/tile roof peeking from behind
      const innerRoofW = Math.max(2, Math.floor(h.w * 0.6));
      const innerRoofX = bx + Math.floor((h.w - innerRoofW) / 2);
      const innerRoofH = h.roofH || 3;
      for (let i = 0; i < innerRoofH; i++) {
        const sw = Math.max(1, innerRoofW - i * 2);
        const sx = innerRoofX + i;
        px(ctx, sx, by - innerRoofH + i, sw, 1, h.roof || '#5a3a28');
      }

      // green-shuttered windows (Cape Dutch typical)
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const shutterColor = h.shutterColor || '#3a5a3a';
      const shutterShade = shade(shutterColor, -0.3);
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2418');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        if (w.w >= 3) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a4a3a');
        // shutters
        px(ctx, wx - 2, wy - 1, 1, w.h + 2, shutterColor);
        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutterColor);
        for (let yy = wy; yy < wy + w.h + 2; yy += 2) {
          px(ctx, wx - 2, yy, 1, 1, shutterShade);
          px(ctx, wx + w.w + 1, yy, 1, 1, shutterShade);
        }
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }

      // grand front door with fanlight
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx - 1, dy - 2, d.w + 2, 1, '#5a4a3a');     // small lintel
        px(ctx, dx, dy - 1, d.w, 1, '#f0e0c0');             // fanlight
        px(ctx, dx, dy, d.w, d.h, d.color || '#3a2418');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#1a1008');
        px(ctx, dx + d.w - 2, dy + (d.h >> 1), 1, 1, '#d4a040');
      }
    },

    // Russian izba — log-walled cabin with carved trim ('nalichniki') framing the windows.
    izba(ctx, bx, by, h) {
      // log body
      px(ctx, bx, by, h.w, h.h, h.body);
      for (let y = by + 1; y < by + h.h - 1; y += 2) {
        px(ctx, bx, y, h.w, 1, shade(h.body, -0.2));
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.28));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // log-end pegs at corners
      for (let y = by + 2; y < by + h.h - 1; y += 3) {
        px(ctx, bx, y, 1, 1, shade(h.body, -0.4));
        px(ctx, bx + h.w - 1, y, 1, 1, shade(h.body, -0.4));
      }
      // base shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.35));

      // chimney behind roof
      if (h.chimney) {
        const cx = bx + h.chimney.x;
        const cy = by + h.chimney.y;
        px(ctx, cx, cy, h.chimney.w, h.chimney.h, '#3a2418');
        px(ctx, cx, cy, h.chimney.w, 1, '#5a4030');
      }

      // steep gable roof
      const roofH = h.roofH || 8;
      for (let i = 0; i < roofH; i++) {
        const t = roofH > 1 ? i / (roofH - 1) : 0;
        const sw = Math.max(1, Math.round(h.w - t * (h.w - 1)));
        const sx = bx + Math.round((h.w - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        if (i > 0 && i % 2 === 0 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.1));
        }
      }
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.3));

      // carved trim band along the eave — alternating notch pattern
      const trimColor = h.trimColor || '#f0e8d4';
      for (let x = bx; x < bx + h.w; x++) {
        if (x % 2 === 0) px(ctx, x, by, 1, 1, trimColor);
      }
      // ornamental icicle below the eave
      const peakX = bx + (h.w >> 1);
      const peakY = by - roofH;
      px(ctx, peakX - 2, peakY + 1, 5, 1, trimColor);
      px(ctx, peakX, peakY, 1, 1, trimColor);

      // windows with bold painted nalichniki frames
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const frameColor = h.frameColor || '#3a5e8a';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // painted frame
        px(ctx, wx - 2, wy - 1, w.w + 4, w.h + 2, frameColor);
        // small pediment above
        px(ctx, wx - 1, wy - 2, w.w + 2, 1, frameColor);
        px(ctx, wx + (w.w >> 1), wy - 3, 1, 1, frameColor);
        // glass
        px(ctx, wx, wy, w.w, w.h, lit ? '#f8d878' : '#3a4a5e');
        // cross mullion
        px(ctx, wx + (w.w >> 1), wy, 1, w.h, shade(frameColor, 0.3));
        if (w.h >= 4) px(ctx, wx, wy + (w.h >> 1), w.w, 1, shade(frameColor, 0.3));
        if (lit) {
          ctx.fillStyle = 'rgba(248,216,122,0.18)';
          ctx.fillRect(wx - 3, wy - 4, w.w + 6, w.h + 6);
        }
      }

      // door (often framed with painted lintel)
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx - 1, dy - 1, d.w + 2, 1, frameColor);
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a3a22');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#2a1810');
      }
      // smoke if cold
      if (h.chimney && state.temperatureC < 5) {
        drawSmoke(ctx, bx + h.chimney.x + (h.chimney.w >> 1), by + h.chimney.y, state.time + h.x);
      }
    },

    // Mongolian ger — circular felt yurt with conical roof, red door, vent ring on top.
    ger(ctx, bx, by, h) {
      const cx = bx + (h.w >> 1);
      const r = h.w / 2;
      // felt body — slightly bulging cylinder silhouette
      for (let y = 0; y < h.h; y++) {
        const yT = y / Math.max(1, h.h - 1);
        const halfW = Math.max(1, Math.round(r * (1 - Math.abs(yT - 0.5) * 0.1)));
        const xL = cx - halfW;
        const w = halfW * 2 + 1;
        px(ctx, xL, by + y, w, 1, h.body);
        px(ctx, xL + w - 1, by + y, 1, 1, shade(h.body, -0.18));
        px(ctx, xL, by + y, 1, 1, shade(h.body, 0.08));
      }
      // decorative band around the upper third (typical felt rope wrap)
      const bandY = by + Math.floor(h.h * 0.55);
      const bandColor = h.bandColor || '#a83824';
      for (let dx = -r + 1; dx <= r - 1; dx++) {
        if (Math.floor(Math.abs(dx)) % 3 === 0) {
          px(ctx, cx + dx, bandY, 1, 1, bandColor);
        }
      }
      // base anchor strip
      px(ctx, bx - 1, by + h.h - 1, h.w + 2, 1, shade(h.body, -0.35));

      // conical roof (sloped up to a point)
      const roofH = h.roofH || 5;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(3, Math.round(h.w + 2 - t * h.w));
        const sx = cx - Math.floor(sw / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        // radial roof pole hints — small dark dashes
        if (sw > 6 && i === Math.floor(roofH * 0.5)) {
          for (let dx = 1; dx < sw - 1; dx += 3) {
            px(ctx, sx + dx, by - i - 1, 1, 1, shade(h.roof, -0.3));
          }
        }
      }
      // top vent ring (toono) — small dark hole
      px(ctx, cx - 1, by - roofH, 2, 1, '#1a140a');
      // dark eave at the wall-roof junction
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.3));

      // red painted door (always — gers face south so the door faces us here)
      const dW = Math.max(3, Math.floor(h.w * 0.3));
      const dH = Math.max(3, Math.floor(h.h * 0.6));
      const dx = cx - (dW >> 1);
      const dy = by + h.h - dH;
      px(ctx, dx - 1, dy - 1, dW + 2, 1, '#5a1a14');
      px(ctx, dx, dy, dW, dH, '#a83824');
      px(ctx, dx, dy, dW, 1, '#c84a3a');
      // door panel divider
      px(ctx, dx + (dW >> 1), dy, 1, dH, '#5a1a14');

      // smoke from the toono if cold
      if (state.temperatureC < 8) {
        drawSmoke(ctx, cx, by - roofH - 1, state.time + h.x);
      }
    },

    // Inner-city terrace row — Victorian-era attached 2-3 storey terraces with iron lacework
    'terrace-row'(ctx, bx, by, h) {
      // body (each "house" is one unit, attached to neighbors)
      px(ctx, bx, by, h.w, h.h, h.body);
      // brick mortar (offset pattern)
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        const offset = ((y - by) % 4 === 2) ? 2 : 0;
        for (let x = bx + offset; x < bx + h.w; x += 4) {
          px(ctx, x, y, 1, 1, shade(h.body, -0.18));
        }
      }
      // shared wall lines (vertical dividers between terraces)
      px(ctx, bx, by, 1, h.h, shade(h.body, -0.4));
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.4));
      // top highlight
      px(ctx, bx + 1, by, h.w - 2, 1, shade(h.body, 0.08));

      // floor divisions
      const floors = h.floors || 2;
      for (let f = 1; f < floors; f++) {
        const fy = by + Math.floor(f * h.h / floors);
        px(ctx, bx + 1, fy, h.w - 2, 1, shade(h.body, -0.25));
        // small string-course detail
        if (h.stringCourse !== false) {
          px(ctx, bx, fy - 1, h.w, 1, shade(h.body, -0.15));
        }
      }

      // top — either flat parapet or small pitched
      if (h.parapet !== false) {
        // ornate parapet (extends slightly above body)
        px(ctx, bx - 1, by - 2, h.w + 2, 2, h.body);
        px(ctx, bx - 1, by - 2, h.w + 2, 1, shade(h.body, -0.18));
        // dentil moulding
        for (let x = bx + 1; x < bx + h.w - 1; x += 2) {
          px(ctx, x, by - 1, 1, 1, shade(h.body, -0.35));
        }

      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;

        // glass

        // sash mullions
        if (w.w >= 4) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a4a3a');
        if (w.h >= 5) px(ctx, wx, wy + (w.h >> 1), w.w, 1, '#5a4a3a');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.15)';

      // iron lacework balcony (iconic for Aussie/UK terraces)
      if (h.lacework) {

          if (x % 2 === 1) px(ctx, x, balY - 4, 1, 1, '#2a2a2a');

      if (h.door) {

        // brass handle

    // Mid-rise European apartment — wide 4-6 storey building, stucco with regular windows
    'apartment-mid'(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // edge shadow & highlight
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.18));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));
      // base shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.28));
      // string courses between floors
      const floors = h.floors || 5;
      const floorH = h.h / floors;
      for (let f = 1; f < floors; f++) {
        const fy = by + Math.round(f * floorH);
        px(ctx, bx, fy, h.w, 1, shade(h.body, -0.18));
      }
      // ground-floor (often a darker shopfront/plinth)
      const groundY = by + Math.round((floors - 1) * floorH);
      px(ctx, bx, groundY, h.w, h.h - (groundY - by), shade(h.body, -0.22));

      // top cornice
      px(ctx, bx - 1, by, h.w + 2, 1, shade(h.body, -0.35));
      px(ctx, bx - 1, by + 1, h.w + 2, 1, h.body);

      // mansard-style attic roof
      if (h.mansard) {
        const mH = h.mansardH || 4;
        for (let i = 0; i < mH; i++) {
          const sw = h.w + 2 - i * 2;
          const sx = bx - 1 + i;
          if (sw > 0) px(ctx, sx, by - i - 1, sw, 1, h.roof || '#3a3a3a');
          // small dormer windows
          if (i === Math.floor(mH * 0.4) && sw > 14) {
            for (let dx = 4; dx < sw - 4; dx += 8) {
              const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
              px(ctx, sx + dx, by - i - 1, 2, 1, lit ? '#f0c878' : '#3a4858');
            }
          }
        }
      }

      // window grid
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const cols = h.cols || Math.max(3, Math.floor(h.w / 5));
      const colW = h.w / cols;
      const winW = 3, winH = Math.max(3, Math.floor(floorH - 4));
      const litHash = (c, r) => {
        const v = Math.sin((c * 17.1 + r * 31.7 + h.x * 7.3) * 1.0) * 9301;
        return v - Math.floor(v);
      };
      // skip ground floor (drawn as plinth)
      for (let f = 0; f < floors - 1; f++) {
        const fy = by + Math.round(f * floorH) + 2;
        for (let c = 0; c < cols; c++) {
          const wx = bx + Math.round(c * colW + (colW - winW) / 2);
          const isLit = lit && litHash(c, f) > 0.45;
          // shutters
          px(ctx, wx - 1, fy - 1, winW + 2, winH + 2, '#2a1810');
          px(ctx, wx, fy, winW, winH, isLit ? '#f0c878' : (lit ? shade(h.body, -0.4) : '#3a4858'));
          if (winH >= 4) px(ctx, wx, fy + (winH >> 1), winW, 1, '#5a4a3a');
          if (isLit) {

            ctx.fillRect(wx - 2, fy - 2, winW + 4, winH + 4);

            for (let dx = wx - 2; dx < wx + winW + 2; dx += 2) {

            }
          }

      }
      // shopfront on ground floor (warm if lit)
      const shopH = h.h - (groundY - by);
      const shopColor = lit ? '#e8a040' : shade(h.body, -0.45);
      for (let c = 0; c < cols; c++) {
        const wx = bx + Math.round(c * colW + colW * 0.15);
        const wW = Math.round(colW * 0.7);
        if (wW < 2) continue;
        px(ctx, wx, groundY + 2, wW, shopH - 4, shopColor);
        if (lit) {
          ctx.fillStyle = 'rgba(232,160,64,0.18)';
          ctx.fillRect(wx - 1, groundY + 1, wW + 2, shopH - 2);
        }
      }
    },

    // Bavarian half-timber — white plaster body with dark wood beams in cross-pattern
    halftimber(ctx, bx, by, h) {
      // body — white plaster
      px(ctx, bx, by, h.w, h.h, h.body);
      // horizontal beams: top, middle, bottom
      px(ctx, bx, by, h.w, 1, '#3a2818');
      px(ctx, bx, by + h.h - 1, h.w, 1, '#3a2818');
      // floor divider
      const midY = by + Math.floor(h.h * 0.5);
      px(ctx, bx, midY, h.w, 1, '#3a2818');
      // vertical posts at edges
      px(ctx, bx, by, 1, h.h, '#3a2818');
      px(ctx, bx + h.w - 1, by, 1, h.h, '#3a2818');
      // diagonal cross beams (one X per panel)
      const drawDiag = (x0, y0, x1, y1) => {
        const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
        const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
        let err = dx - dy;
        let cx = x0, cy = y0;
        while (true) {
          px(ctx, cx, cy, 1, 1, '#3a2818');
          if (cx === x1 && cy === y1) break;
          const e2 = err * 2;
          if (e2 > -dy) { err -= dy; cx += sx; }
          if (e2 < dx) { err += dx; cy += sy; }
        }
      };
      // lower panel cross
      drawDiag(bx + 1, midY + 1, bx + (h.w >> 1) - 1, by + h.h - 2);
      drawDiag(bx + h.w - 2, midY + 1, bx + (h.w >> 1) + 1, by + h.h - 2);
      // upper panel cross
      drawDiag(bx + 1, by + 1, bx + (h.w >> 1) - 1, midY - 1);
      drawDiag(bx + h.w - 2, by + 1, bx + (h.w >> 1) + 1, midY - 1);

      // gable roof (steep)
      const roofH = h.roofH || 6;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(1, Math.round(h.w - t * (h.w - 1)));
        const sx = bx + Math.round((h.w - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        if (i > 0 && i % 2 === 0 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.1));
        }
      }
      px(ctx, bx - 1, by - 1, h.w + 2, 1, shade(h.roof, -0.3));

      // gable window (heart-shaped suggestion just a small bright pixel pair)
      if (h.gableWindow) {
        const gWy = by - Math.floor(roofH * 0.55);
        const gWx = bx + (h.w >> 1) - 1;
        const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
        px(ctx, gWx, gWy, 2, 2, lit ? '#f0c878' : '#3a2818');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(gWx - 1, gWy - 1, 4, 4);
        }
      }

      // windows with shutters
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const shutter = h.shutterColor || '#7a3024';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        // shutters
        px(ctx, wx - 2, wy - 1, 1, w.h + 2, shutter);
        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutter);
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.16)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a2418');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#2a1208');
      }
      if (h.chimney) {
        const cx = bx + h.chimney.x;
        const cy = by + h.chimney.y;
        px(ctx, cx, cy, h.chimney.w, h.chimney.h, '#5a3a25');
      }
    },

    // Dutch canal house — very narrow tall brick with stepped-gable top, lots of small windows
    'canal-narrow'(ctx, bx, by, h) {
      // body
      px(ctx, bx, by, h.w, h.h, h.body);
      // brick mortar
      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        const offset = ((y - by) % 4 === 2) ? 2 : 0;
        for (let x = bx + offset; x < bx + h.w; x += 4) {
          px(ctx, x, y, 1, 1, shade(h.body, -0.2));
        }
        px(ctx, bx, y - 1, h.w, 1, shade(h.body, -0.12));
      }
      // edge shadow
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.25));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.08));

      // stepped or bell gable above body
      const gableH = h.gableH || 5;
      const steps = h.gableSteps || 3;
      const stepW = Math.max(1, Math.floor(h.w / (steps * 2 + 1)));
      for (let s = 0; s < steps; s++) {
        const ledgeW = h.w - s * stepW * 2;
        const ledgeX = bx + s * stepW;
        const ledgeY = by - 1 - s * 2;
        px(ctx, ledgeX, ledgeY, ledgeW, 1, shade(h.body, -0.15));
        px(ctx, ledgeX + 1, ledgeY - 1, ledgeW - 2, 1, h.body);
      }
      // gable peak ornament
      const peakX = bx + (h.w >> 1);
      const peakY = by - 1 - steps * 2 - 1;
      px(ctx, peakX, peakY, 1, 2, '#3a2818');
      // small finial
      px(ctx, peakX - 1, peakY - 1, 3, 1, '#3a2818');

      // windows on multiple floors
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const glassColor = lit ? '#f0c878' : '#3a4a5e';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#2a1810');
        px(ctx, wx, wy, w.w, w.h, glassColor);
        // mullion cross (Dutch style)
        if (w.w >= 3) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a4a3a');
        if (w.h >= 4) px(ctx, wx, wy + (w.h >> 1), w.w, 1, '#5a4a3a');
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.16)';
          ctx.fillRect(wx - 2, wy - 2, w.w + 4, w.h + 4);
        }
      }
      // ground-floor door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#3a2818');
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#d4a040');
      }
      // hoisting hook just below gable (iconic for Dutch canal houses)
      px(ctx, peakX, by + 1, 1, 2, '#2a2a2a');
    },

    // Swiss alpine chalet — wide wooden body with low broad roof and balcony
    chalet(ctx, bx, by, h) {

      for (let y = by + 2; y < by + h.h - 1; y += 2) {
        px(ctx, bx, y, h.w, 1, shade(h.body, -0.15));
      }
      px(ctx, bx + h.w - 1, by, 1, h.h, shade(h.body, -0.25));
      px(ctx, bx, by, 1, h.h, shade(h.body, 0.1));
      // base shadow
      px(ctx, bx, by + h.h - 1, h.w, 1, shade(h.body, -0.3));

      // central balcony with railing
      if (h.balcony) {
        const balY = by + Math.floor(h.h * 0.4);
        // floor of balcony
        px(ctx, bx - 1, balY, h.w + 2, 1, shade(h.body, -0.4));
        // railing posts
        for (let x = bx; x < bx + h.w; x += 2) {
          px(ctx, x, balY - 2, 1, 2, shade(h.body, -0.35));
        }
        // top rail
        px(ctx, bx - 1, balY - 3, h.w + 2, 1, shade(h.body, -0.4));
      }

      // wide low-pitch roof with big overhang
      const roofH = h.roofH || 4;
      const overhang = h.overhang || 4;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(2, Math.round(h.w + overhang * 2 - t * h.w * 0.85));
        const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        if (i > 0 && i % 2 === 1 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.12));
        }
      }
      px(ctx, bx - overhang, by - 1, h.w + overhang * 2, 1, shade(h.roof, -0.3));
      // exposed rafters (small dark pixels at the eave underside)
      for (let x = bx - overhang + 1; x < bx + h.w + overhang; x += 3) {
        px(ctx, x, by, 1, 1, shade(h.roof, -0.4));

      // windows with heart-cutout shutters (red/green)
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const shutter = h.shutterColor || '#3a6a3a';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, '#3a2818');
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        // mullion cross
        if (w.w >= 4) px(ctx, wx + (w.w >> 1), wy, 1, w.h, '#5a4a3a');
        // shutters
        px(ctx, wx - 2, wy - 1, 1, w.h + 2, shutter);
        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutter);
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a3a22');
        px(ctx, dx + (d.w >> 1), dy, 1, d.h, '#3a2818');
      }
      // snow on roof if snowing or alpine flag
      if (state.snowIntensity > 0.05 || h.alpineSnow) {
        const sa = h.alpineSnow ? 0.65 : Math.min(0.85, state.snowIntensity);
        for (let i = 0; i < roofH; i++) {
          const t = i / Math.max(1, roofH - 1);
          const sw = Math.max(2, Math.round(h.w + overhang * 2 - t * h.w * 0.85));
          const sx = bx - overhang + Math.round((h.w + overhang * 2 - sw) / 2);
          ctx.fillStyle = `rgba(248,250,255,${sa})`;
          ctx.fillRect(sx, by - i - 1, sw, 1);
        }
      }
    },

    // American suburb — two-storey gabled home with attached single-car garage and shutters
    suburban(ctx, bx, by, h) {
      const houseW = h.houseW || Math.floor(h.w * 0.66);
      const garageW = h.w - houseW;

      px(ctx, bx, by, houseW, h.h, h.body);

      // floor divider between 1st and 2nd storey
      const floorY = by + Math.floor(h.h * 0.5);

      // gable roof (steep triangle)
      const roofH = h.roofH || 7;
      for (let i = 0; i < roofH; i++) {
        const t = i / Math.max(1, roofH - 1);
        const sw = Math.max(1, Math.round(houseW - t * (houseW - 1)));
        const sx = bx + Math.round((houseW - sw) / 2);
        px(ctx, sx, by - i - 1, sw, 1, h.roof);
        // shingle highlight every other row
        if (i > 0 && i % 2 === 0 && sw > 4) {
          px(ctx, sx + 1, by - i - 1, sw - 2, 1, shade(h.roof, 0.1));
        }
      }
      px(ctx, bx - 1, by - 1, houseW + 2, 1, shade(h.roof, -0.3));

      // attic gable window

      px(ctx, gWx, gWy, 2, 2, '#3a2818');
      // small frame
      px(ctx, gWx - 1, gWy - 1, 4, 1, '#e8e0d0');
      px(ctx, gWx - 1, gWy + 2, 4, 1, '#e8e0d0');

      // garage attached on right
      const garageH = Math.floor(h.h * 0.72);
      const garageY = by + h.h - garageH;

      for (let y = garageY + 4; y < garageY + garageH - 1; y += 2) {
        px(ctx, gx + 1, y, garageW - 2, 1, shade(h.body, -0.55));
      }
      px(ctx, gx + 1, garageY + 2, garageW - 2, 1, shade(h.body, -0.6));

      // windows
      const lit = !state.isDay || state.sunPhase < 0.27 || state.sunPhase > 0.73;
      const shutterColor = h.shutterColor || '#3a4858';
      for (const w of h.windows) {
        const wx = bx + w.x, wy = by + w.y;
        // dark frame
        px(ctx, wx - 1, wy - 1, w.w + 2, w.h + 2, shade(h.body, -0.35));
        // glass
        px(ctx, wx, wy, w.w, w.h, lit ? '#f0c878' : '#3a4a5e');
        // mullion

        px(ctx, wx + w.w + 1, wy - 1, 1, w.h + 2, shutterColor);
        if (lit) {
          ctx.fillStyle = 'rgba(240,200,122,0.18)';
          ctx.fillRect(wx - 3, wy - 2, w.w + 6, w.h + 4);
        }
      }
      // front door
      if (h.door) {
        const d = h.door;
        const dx = bx + d.x, dy = by + d.y;
        px(ctx, dx, dy, d.w, d.h, d.color || '#5a2418');
        px(ctx, dx + d.w - 1, dy + (d.h >> 1), 1, 1, '#d4a040');
